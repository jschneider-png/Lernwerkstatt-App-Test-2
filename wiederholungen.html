<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alle Wiederholungen | Lernwerkstatt</title><style>*{box-sizing:border-box}body{font:16px/1.55 system-ui;background:linear-gradient(#e7f5fb,#f8fbfd);color:#12334b;margin:0}main{max-width:1120px;margin:auto;padding:35px 20px 70px}a{color:#14628d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #cce2ed;border-radius:18px;padding:20px;box-shadow:0 10px 25px #113b5510}.card h2{margin:8px 0}.card a{display:inline-block;margin-top:12px;padding:11px 15px;background:#0c4768;color:white;border-radius:10px;text-decoration:none;font-weight:750}.muted{color:#5c7181}.eyebrow{color:#1479a3;font-size:.78rem;font-weight:900;letter-spacing:.12em}.hero{background:#0a2c45;color:white;border-radius:20px;padding:26px;margin:20px 0 26px}.hero p{color:#d0e8f5}</style><script src="saison.js"></script>
</head><body><main><a href="index.html">← Zum Klassenzimmer</a><div class="hero"><div class="eyebrow">FLIPPED CLASSROOM · SHK 11</div><h1>Wiederholung der letzten Blockwoche</h1><p>Wähle die abgeschlossene Blockwoche, die du wiederholen möchtest. Vier Lernstationen mit Wissen, interaktiven Fragen, Transferaufträgen und Platz für eigene Materialien.</p></div><div class="grid" id="items"></div></main><script src="wiederholungen-inhalte.js"></script><script>const host=document.getElementById('items');Object.entries(window.WIEDERHOLUNGEN||{}).forEach(([bw,item])=>{const card=document.createElement('article');card.className='card';const k=document.createElement('div');k.className='eyebrow';k.textContent='BLOCKWOCHE '+String(bw).padStart(2,'0');const h=document.createElement('h2');h.textContent=item.titel;const p=document.createElement('p');p.className='muted';p.textContent=item.dauer+' Minuten · '+item.stationen.length+' Stationen · '+item.punkte+' XP';card.append(k,h,p);if(item.status==='verfuegbar'){const a=document.createElement('a');a.href='wiederholung.html?bw='+bw;a.textContent='Wiederholung starten ↗';card.append(a)}else{const s=document.createElement('p');s.className='muted';s.textContent='In Vorbereitung';card.append(s)}host.append(card)});</script></body></html>
