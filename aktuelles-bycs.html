<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Aktuelles | Sanitärtechnik</title><style>
:root{--bg:#f5f8fb;--ink:#172634;--muted:#617484;--navy:#0e3450;--blue:#1f7296;--accent:#ee9b32;--line:#d8e5ec;--soft:#edf5f8;--water:#dff3fb;--waste:#f3eee9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(#fbfdff,#edf4f7);color:var(--ink)}
a{color:inherit}.container{max-width:1250px;margin:auto;padding:0 22px}
header{position:sticky;top:0;z-index:50;background:rgba(14,52,80,.97);border-bottom:1px solid rgba(255,255,255,.1)}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.brand strong{display:block}.brand small{display:block;color:#c1d7e3;margin-top:2px}
.menu{display:flex;gap:6px;flex-wrap:wrap}.menu a{color:#eef6fa;text-decoration:none;font-weight:750;font-size:.88rem;padding:9px 11px;border-radius:9px}.menu a:hover{background:rgba(255,255,255,.14)}
.section{padding:38px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:20px}.section-head h2{margin:5px 0 0}.section-head p{margin:0;color:var(--muted);max-width:620px;line-height:1.55}.eyebrow{font-size:.74rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px}.card p{color:var(--muted);line-height:1.55}
.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#e7f3f8;color:var(--blue);font-size:.82rem;font-weight:850}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:850;border:1px solid #c1d3df;background:#fff;color:var(--blue);transition:.15s}
.btn:hover{transform:translateY(-1px);background:var(--soft)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#173248}.btn.secondary{background:var(--soft)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.topic-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:inherit;transition:.18s}.topic-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(28,58,78,.10)}
.topic-card h4{margin:10px 0}.topic-card p{margin:0;color:var(--muted);line-height:1.5}.mebis-note{margin-top:12px;color:var(--blue);font-weight:850}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
details.group{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}details.group summary{cursor:pointer;padding:16px 18px;font-weight:850}
.link-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 16px}.link-item{background:#f8fbfd;border:1px solid var(--line);padding:12px;border-radius:12px;display:flex;justify-content:space-between;gap:10px}.link-item a{color:var(--blue);font-weight:850;text-decoration:none}
footer{background:#0d2c43;color:#aec1cf;padding:26px 0;margin-top:28px}
@media(max-width:850px){.topic-grid,.grid-3,.grid-2,.link-list{grid-template-columns:1fr}.section-head,.nav{flex-direction:column;align-items:flex-start}}

/* SAISON-MODI */
.theme-switcher{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:6px;padding:7px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid rgba(20,50,75,.16);box-shadow:0 8px 24px rgba(0,0,0,.14);backdrop-filter:blur(8px)}
.theme-switcher button{border:0;border-radius:999px;padding:8px 11px;cursor:pointer;font:700 13px/1 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#edf4f8;color:#17364e}
.theme-switcher button.active{outline:2px solid currentColor}
.theme-switcher .halloween{background:#2a1d33;color:#ff9d2f}
.theme-switcher .christmas{background:#edf7f1;color:#0f6c3b}
html[data-theme="halloween"] body{background:radial-gradient(circle at 15% 10%,rgba(106,41,139,.28),transparent 25%),radial-gradient(circle at 85% 20%,rgba(255,112,0,.18),transparent 20%),linear-gradient(180deg,#17131e,#221927 60%,#151219);color:#f4eee8}
html[data-theme="halloween"] header,html[data-theme="halloween"] .hero,html[data-theme="halloween"] .sidebar{background:linear-gradient(135deg,#18111f,#29172e 55%,#3a1a20)!important;color:#fff!important}
html[data-theme="halloween"] .card,html[data-theme="halloween"] .topic-card,html[data-theme="halloween"] .panel,html[data-theme="halloween"] .box,html[data-theme="halloween"] .poster,html[data-theme="halloween"] .material-panel,html[data-theme="halloween"] .materials,html[data-theme="halloween"] .progress,html[data-theme="halloween"] .testbox,html[data-theme="halloween"] .insight{background:#241d29!important;color:#f6efe9!important;border-color:#5c3b63!important}
html[data-theme="halloween"] .muted,html[data-theme="halloween"] p,html[data-theme="halloween"] small{color:#d7c8d8!important}
html[data-theme="halloween"] h1,html[data-theme="halloween"] h2,html[data-theme="halloween"] h3,html[data-theme="halloween"] strong{color:#fff6ec!important}
html[data-theme="halloween"] .btn.primary{background:#e46f1f!important;color:#fff!important;border-color:#e46f1f!important}
html[data-theme="halloween"] .badge{background:#3a2943!important;color:#ffb15d!important}
html[data-theme="christmas"] body{background:radial-gradient(circle at 10% 20%,rgba(255,255,255,.65),transparent 24%),radial-gradient(circle at 90% 10%,rgba(255,255,255,.55),transparent 22%),linear-gradient(180deg,#eef7f2,#f9fbfa 55%,#e6f1ea);color:#173d2e}
html[data-theme="christmas"] header,html[data-theme="christmas"] .hero,html[data-theme="christmas"] .sidebar{background:linear-gradient(135deg,#0e5b3d,#0a6d47 55%,#8b1f2e)!important;color:#fff!important}
html[data-theme="christmas"] .card,html[data-theme="christmas"] .topic-card,html[data-theme="christmas"] .panel,html[data-theme="christmas"] .box,html[data-theme="christmas"] .poster,html[data-theme="christmas"] .material-panel,html[data-theme="christmas"] .materials,html[data-theme="christmas"] .progress,html[data-theme="christmas"] .testbox,html[data-theme="christmas"] .insight{background:#fff!important;color:#173d2e!important;border-color:#bfd9c7!important}
html[data-theme="christmas"] .btn.primary{background:#9f2433!important;color:#fff!important;border-color:#9f2433!important}
html[data-theme="christmas"] .badge{background:#e8f4ec!important;color:#0e6a43!important}


/* ============================================================
   SAISONMODI DELUXE – DEKORATIONEN & ANIMATIONEN
   ============================================================ */
.season-decor{
  position:fixed;
  inset:0;
  z-index:9000;
  pointer-events:none;
  overflow:hidden;
  display:none;
}
html[data-theme="halloween"] .season-decor.halloween-decor,
html[data-theme="christmas"] .season-decor.christmas-decor{display:block}

/* Halloween */
.halloween-decor .web{
  position:absolute;
  top:-8px;
  width:115px;
  height:115px;
  opacity:.42;
  font-size:96px;
  line-height:1;
  filter:grayscale(.2);
}
.halloween-decor .web.left{left:-12px;transform:rotate(-20deg)}
.halloween-decor .web.right{right:-12px;transform:scaleX(-1) rotate(-20deg)}
.halloween-decor .pumpkin{
  position:absolute;
  bottom:10px;
  font-size:48px;
  filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));
  animation:pumpkinBob 3.4s ease-in-out infinite;
}
.halloween-decor .pumpkin.p1{left:3%}
.halloween-decor .pumpkin.p2{right:4%;font-size:58px;animation-delay:.8s}
.halloween-decor .pumpkin.p3{left:47%;font-size:38px;animation-delay:1.5s}
.halloween-decor .zombie{
  position:absolute;
  bottom:4px;
  left:12%;
  font-size:54px;
  animation:zombieSway 4.2s ease-in-out infinite;
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.38));
}
.halloween-decor .ghost{
  position:absolute;
  top:24%;
  right:3%;
  font-size:47px;
  opacity:.72;
  animation:ghostFloat 5.5s ease-in-out infinite;
}
.halloween-decor .witch{
  position:absolute;
  top:74px;
  left:-140px;
  font-size:62px;
  animation:witchFly 18s linear infinite;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.4));
}
.halloween-decor .bats{
  position:absolute;
  top:18px;
  left:34%;
  font-size:25px;
  letter-spacing:15px;
  opacity:.72;
  animation:batsDrift 8s ease-in-out infinite;
}
.halloween-decor .fog{
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:-30px;
  height:135px;
  background:
    radial-gradient(ellipse at 15% 70%,rgba(220,215,235,.18),transparent 45%),
    radial-gradient(ellipse at 55% 65%,rgba(210,200,230,.16),transparent 43%),
    radial-gradient(ellipse at 85% 72%,rgba(220,215,235,.14),transparent 46%);
  filter:blur(12px);
  animation:fogMove 10s ease-in-out infinite alternate;
}

/* Christmas */
.christmas-decor .lights{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:38px;
  display:flex;
  justify-content:space-around;
  align-items:flex-start;
  padding:3px 12px 0;
  background:linear-gradient(180deg,rgba(11,76,48,.35),transparent);
}
.christmas-decor .bulb{
  width:11px;height:16px;border-radius:50% 50% 45% 45%;
  box-shadow:0 0 12px currentColor;
  animation:twinkle 1.8s ease-in-out infinite alternate;
}
.christmas-decor .bulb:nth-child(4n+1){color:#e92d3f;background:#e92d3f}
.christmas-decor .bulb:nth-child(4n+2){color:#ffd65c;background:#ffd65c;animation-delay:.35s}
.christmas-decor .bulb:nth-child(4n+3){color:#4cc4ff;background:#4cc4ff;animation-delay:.7s}
.christmas-decor .bulb:nth-child(4n){color:#59d27c;background:#59d27c;animation-delay:1s}
.christmas-decor .snowman{
  position:absolute;
  bottom:10px;
  left:3%;
  font-size:58px;
  animation:snowmanBob 4s ease-in-out infinite;
}
.christmas-decor .reindeer{
  position:absolute;
  bottom:10px;
  right:4%;
  font-size:58px;
  animation:reindeerBob 3.8s ease-in-out infinite;
}
.christmas-decor .santa{
  position:absolute;
  top:64px;
  left:-180px;
  font-size:60px;
  animation:santaFly 20s linear infinite;
  filter:drop-shadow(0 7px 7px rgba(0,0,0,.22));
}
.christmas-decor .tree{
  position:absolute;
  bottom:5px;
  right:13%;
  font-size:49px;
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.16));
}
.christmas-decor .gift{
  position:absolute;
  bottom:5px;
  right:18%;
  font-size:34px;
}
.snowflake{
  position:absolute;
  top:-30px;
  color:#fff;
  opacity:.82;
  text-shadow:0 0 5px rgba(255,255,255,.9);
  animation:snowFall linear infinite;
}

/* kleine saisonale Beschriftung */
.theme-season-label{
  display:none;
  position:fixed;
  left:14px;
  bottom:14px;
  z-index:8999;
  padding:8px 12px;
  border-radius:999px;
  font:800 12px/1 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  pointer-events:none;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
}
html[data-theme="halloween"] .theme-season-label.halloween-label{
  display:block;background:#2b1b31;color:#ffad4e;border:1px solid #6e466f;
}
html[data-theme="christmas"] .theme-season-label.christmas-label{
  display:block;background:#f8fff9;color:#0f6a3c;border:1px solid #b9d8c3;
}

@keyframes pumpkinBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes zombieSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
@keyframes ghostFloat{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-18px) translateX(-12px)}}
@keyframes witchFly{0%{transform:translateX(0) translateY(0) rotate(-4deg)}45%{transform:translateX(58vw) translateY(25px) rotate(3deg)}100%{transform:translateX(125vw) translateY(-10px) rotate(-2deg)}}
@keyframes batsDrift{0%,100%{transform:translateX(0) translateY(0)}50%{transform:translateX(45px) translateY(13px)}}
@keyframes fogMove{from{transform:translateX(-2%)}to{transform:translateX(4%)}}
@keyframes twinkle{from{opacity:.45;transform:scale(.85)}to{opacity:1;transform:scale(1.12)}}
@keyframes snowmanBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes reindeerBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
@keyframes santaFly{0%{transform:translateX(0) translateY(0)}50%{transform:translateX(62vw) translateY(18px)}100%{transform:translateX(128vw) translateY(-5px)}}
@keyframes snowFall{0%{transform:translateY(-30px) rotate(0deg)}100%{transform:translateY(110vh) rotate(360deg)}}

@media(max-width:700px){
  .halloween-decor .zombie{font-size:42px;left:8%}
  .halloween-decor .pumpkin.p3{display:none}
  .christmas-decor .tree,.christmas-decor .gift{display:none}
  .halloween-decor .witch,.christmas-decor .santa{font-size:48px}
}
@media(prefers-reduced-motion:reduce){
  .season-decor *{animation:none!important}
  .halloween-decor .witch,.christmas-decor .santa{display:none}
  .snowflake{display:none}
}


/* ============================================================
   SAISONMODI PEPPIG – EXTRA EFFEKTE
   ============================================================ */

/* allgemeiner Glow */
html[data-theme="halloween"] .theme-switcher,
html[data-theme="christmas"] .theme-switcher{
  box-shadow:0 0 0 2px rgba(255,255,255,.16),0 10px 30px rgba(0,0,0,.28)!important;
}
html[data-theme="halloween"] .hero{
  box-shadow:inset 0 -14px 40px rgba(255,111,0,.10),0 0 35px rgba(137,61,178,.22)!important;
}
html[data-theme="christmas"] .hero{
  box-shadow:inset 0 -14px 40px rgba(255,255,255,.18),0 0 35px rgba(23,121,74,.18)!important;
}

/* Halloween: stärkere Kartenoptik */
html[data-theme="halloween"] .topic-card,
html[data-theme="halloween"] .card,
html[data-theme="halloween"] .panel,
html[data-theme="halloween"] .box{
  box-shadow:0 8px 22px rgba(0,0,0,.24),0 0 0 1px rgba(255,133,40,.05)!important;
}
html[data-theme="halloween"] .topic-card:hover{
  transform:translateY(-4px) rotate(-.4deg)!important;
  box-shadow:0 15px 32px rgba(0,0,0,.35),0 0 22px rgba(242,113,31,.18)!important;
}
html[data-theme="halloween"] .btn:hover{
  box-shadow:0 0 18px rgba(255,135,48,.32)!important;
}

/* Christmas: stärkere Kartenoptik */
html[data-theme="christmas"] .topic-card,
html[data-theme="christmas"] .card,
html[data-theme="christmas"] .panel,
html[data-theme="christmas"] .box{
  box-shadow:0 7px 20px rgba(11,95,60,.10)!important;
}
html[data-theme="christmas"] .topic-card:hover{
  transform:translateY(-4px)!important;
  box-shadow:0 14px 28px rgba(11,95,60,.18),0 0 18px rgba(190,31,48,.10)!important;
}

/* Halloween-Leuchteffekt an der oberen Kante */
html[data-theme="halloween"] body:before{
  content:"";
  position:fixed;
  left:0;right:0;top:0;height:5px;
  z-index:8998;
  pointer-events:none;
  background:linear-gradient(90deg,#ff6b00,#8a39b8,#ff9a26,#8a39b8,#ff6b00);
  background-size:250% 100%;
  animation:halloweenGlow 6s linear infinite;
  box-shadow:0 0 18px rgba(255,106,0,.6);
}

/* Christmas-Leuchteffekt an der oberen Kante */
html[data-theme="christmas"] body:before{
  content:"";
  position:fixed;
  left:0;right:0;top:0;height:5px;
  z-index:8998;
  pointer-events:none;
  background:linear-gradient(90deg,#0a6d47,#d3273d,#f4c84a,#0a6d47,#d3273d);
  background-size:250% 100%;
  animation:christmasGlow 6s linear infinite;
  box-shadow:0 0 16px rgba(255,255,255,.7);
}

/* Fledermaus-Schwarm */
.halloween-decor .bat{
  position:absolute;
  top:-40px;
  font-size:22px;
  opacity:.85;
  animation:batFall linear infinite;
}
.halloween-decor .bat:nth-of-type(1){left:8%;animation-duration:9s;animation-delay:-2s}
.halloween-decor .bat:nth-of-type(2){left:24%;animation-duration:11s;animation-delay:-6s}
.halloween-decor .bat:nth-of-type(3){left:58%;animation-duration:8s;animation-delay:-4s}
.halloween-decor .bat:nth-of-type(4){left:78%;animation-duration:12s;animation-delay:-8s}
.halloween-decor .bat:nth-of-type(5){left:91%;animation-duration:10s;animation-delay:-3s}

/* kleine Geister, die seitlich einfliegen */
.halloween-decor .ghost-mini{
  position:absolute;
  font-size:31px;
  opacity:.58;
  animation:ghostCross 16s linear infinite;
}
.halloween-decor .g1{top:34%;left:-60px}
.halloween-decor .g2{top:61%;left:-90px;animation-delay:-8s;font-size:25px}

/* Christmas: funkelnde Sterne */
.christmas-decor .star{
  position:absolute;
  color:#ffe177;
  text-shadow:0 0 10px #fff3a8;
  animation:starTwinkle 1.8s ease-in-out infinite alternate;
}
.christmas-decor .s1{top:9%;left:12%;font-size:20px}
.christmas-decor .s2{top:14%;right:16%;font-size:26px;animation-delay:.5s}
.christmas-decor .s3{top:28%;left:52%;font-size:18px;animation-delay:1s}
.christmas-decor .s4{top:44%;right:7%;font-size:22px;animation-delay:.2s}

/* Winterlicher Glitzer am Rand */
html[data-theme="christmas"] .christmas-decor:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 8% 12%,rgba(255,255,255,.75) 0 1px,transparent 2px),
    radial-gradient(circle at 20% 37%,rgba(255,255,255,.55) 0 1px,transparent 2px),
    radial-gradient(circle at 75% 18%,rgba(255,255,255,.72) 0 1px,transparent 2px),
    radial-gradient(circle at 88% 42%,rgba(255,255,255,.62) 0 1px,transparent 2px);
  background-size:80px 80px,100px 100px,120px 120px,90px 90px;
  opacity:.55;
  animation:sparkleShift 9s linear infinite;
}

/* saisonale Banner */
.season-banner{
  display:none;
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:8999;
  pointer-events:none;
  padding:8px 16px;
  border-radius:999px;
  font:900 13px/1 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  letter-spacing:.2px;
  box-shadow:0 8px 22px rgba(0,0,0,.18);
}
html[data-theme="halloween"] .season-banner.halloween-banner{
  display:block;
  background:linear-gradient(90deg,#3a1d41,#652a52);
  color:#ffb45e;
  border:1px solid #8a4d84;
}
html[data-theme="christmas"] .season-banner.christmas-banner{
  display:block;
  background:linear-gradient(90deg,#0f6844,#a62535);
  color:#fff9e6;
  border:1px solid rgba(255,255,255,.45);
}

@keyframes halloweenGlow{0%{background-position:0 0}100%{background-position:250% 0}}
@keyframes christmasGlow{0%{background-position:0 0}100%{background-position:250% 0}}
@keyframes batFall{
  0%{transform:translateY(-50px) translateX(0) rotate(-8deg)}
  40%{transform:translateY(45vh) translateX(35px) rotate(8deg)}
  100%{transform:translateY(110vh) translateX(-25px) rotate(-6deg)}
}
@keyframes ghostCross{
  0%{transform:translateX(0) translateY(0)}
  50%{transform:translateX(55vw) translateY(-16px)}
  100%{transform:translateX(120vw) translateY(8px)}
}
@keyframes starTwinkle{from{opacity:.35;transform:scale(.8) rotate(0)}to{opacity:1;transform:scale(1.25) rotate(25deg)}}
@keyframes sparkleShift{from{transform:translateY(0)}to{transform:translateY(30px)}}

/* lieber peppig, aber nicht störend auf Mobilgeräten */
@media(max-width:700px){
  .season-banner{top:7px;font-size:11px;padding:7px 11px}
  .halloween-decor .bat:nth-of-type(4),
  .halloween-decor .bat:nth-of-type(5),
  .christmas-decor .s3,
  .christmas-decor .s4{display:none}
}

@media(prefers-reduced-motion:reduce){
  body:before,.halloween-decor .bat,.halloween-decor .ghost-mini,.christmas-decor .star{animation:none!important}
}

</style>

<script>
(function(){
  const christmas=document.querySelector('.christmas-decor');
  if(christmas && !christmas.dataset.snowReady){
    christmas.dataset.snowReady='1';
    const chars=['❄','❅','❆','✦'];
    for(let i=0;i<34;i++){
      const s=document.createElement('span');
      s.className='snowflake';
      s.textContent=chars[i%chars.length];
      s.style.left=(i*37%100)+'%';
      s.style.fontSize=(12+(i*7%17))+'px';
      s.style.animationDuration=(7+(i%8))+'s';
      s.style.animationDelay=(-1*(i%9))+'s';
      christmas.appendChild(s);
    }
  }
})();
</script>
