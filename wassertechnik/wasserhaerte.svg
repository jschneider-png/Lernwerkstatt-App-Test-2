<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="t d"><title id="t">Wasserhärte: Calcium, Magnesium und Kalk</title><desc id="d">Drei Härtebereiche, daneben Calcium- und Magnesiumionen und ein verkalkter Duschkopf</desc><rect width="860" height="280" rx="22" fill="#eef8f5"/><text x="30" y="46" font-size="27" font-weight="700" fill="#154737">Wasserhärte verstehen</text><g font-family="sans-serif" font-size="19" text-anchor="middle"><rect x="30" y="88" width="245" height="75" rx="13" fill="#b9e9e8"/><rect x="307" y="88" width="245" height="75" rx="13" fill="#a8d8a2"/><rect x="584" y="88" width="245" height="75" rx="13" fill="#f4cd94"/><text x="152" y="122" fill="#123e42">weich</text><text x="152" y="148" font-size="15" fill="#123e42">unter 8,4 °dH</text><text x="430" y="122" fill="#214329">mittel</text><text x="430" y="148" font-size="15" fill="#214329">8,4 bis 14 °dH</text><text x="706" y="122" fill="#6a3c13">hart</text><text x="706" y="148" font-size="15" fill="#6a3c13">über 14 °dH</text></g><g font-family="sans-serif" font-size="18" fill="#163c4a"><circle cx="125" cy="214" r="24" fill="#3185bb"/><text x="110" y="220" font-size="17" fill="white">Ca</text><text x="154" y="221">²⁺</text><circle cx="273" cy="214" r="24" fill="#40a47a"/><text x="257" y="220" fill="white" font-size="16">Mg</text><text x="303" y="221">²⁺</text><text x="350" y="220">= Härtebildner</text><path d="M620 208 Q660 178 700 208 Q740 238 788 208" stroke="#bd945d" stroke-width="18" stroke-linecap="round" fill="none"/><text x="702" y="259" font-size="16" text-anchor="middle">Kalkbildung möglich</text></g></svg>