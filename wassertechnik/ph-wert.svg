<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-labelledby="t d"><title id="t">pH-Skala und Vergleich dreier Proben</title><desc id="d">Skala von sauer über neutral bis alkalisch, Proben bei 6, 7 und 9</desc><defs><linearGradient id="g"><stop stop-color="#d93b40"/><stop offset=".35" stop-color="#f6ca42"/><stop offset=".5" stop-color="#62b979"/><stop offset=".74" stop-color="#2b8bcb"/><stop offset="1" stop-color="#623eae"/></linearGradient></defs><rect width="860" height="280" rx="22" fill="#eef6fc"/><text x="35" y="45" font-size="27" font-weight="700" fill="#12375e">pH-Wert: sauer · neutral · alkalisch</text><rect x="60" y="102" width="740" height="49" rx="12" fill="url(#g)"/><g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#17324a"><text x="60" y="177">0</text><text x="430" y="177">7</text><text x="800" y="177">14</text><text x="180" y="215">sauer</text><text x="430" y="215">neutral</text><text x="700" y="215">alkalisch</text></g><g fill="#153955" stroke="#fff" stroke-width="2"><circle cx="377" cy="127" r="13"/><circle cx="430" cy="127" r="13"/><circle cx="536" cy="127" r="13"/></g><g font-size="16" font-family="sans-serif" text-anchor="middle" fill="#17324a"><text x="377" y="88">A · 6</text><text x="430" y="75">B · 7</text><text x="536" y="88">C · 9</text></g><text x="60" y="257" font-family="sans-serif" font-size="15" fill="#33536a">Eine pH-Stufe entspricht dem Faktor 10 bei der Wasserstoffionenaktivität.</text></svg>