<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kompetenzcheck pH-Wert</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#163c53;background:#f1f6f9}*{box-sizing:border-box}body{margin:0;line-height:1.5}header{background:#f9fcfe;border-bottom:1px solid #d1e2ea;padding:14px max(16px,calc((100vw - 780px)/2))}.back{color:#176989;text-decoration:none;font-size:14px;font-weight:650}main{max-width:780px;margin:auto;padding:18px 16px 70px}h1{font-size:clamp(24px,4vw,34px);margin:8px 0}.intro{color:#58778a;margin:0 0 18px}.timerbar{display:flex;align-items:center;justify-content:space-between;background:white;border:1px solid #d2e3eb;border-radius:12px;padding:9px 14px;margin-bottom:16px;gap:12px}.timerbar span{font-size:13px;color:#557489}.timerbar strong{font-size:20px;font-variant-numeric:tabular-nums;color:#215b79}.timerbar.ended{background:#fff5ea}.quiz-question{background:white;border:1px solid #d5e4eb;border-radius:13px;margin:12px 0;padding:15px}fieldset{min-width:0}legend{padding:0 5px;font-weight:750}.answer{display:flex;gap:9px;align-items:center;margin:9px 0;padding:9px;border:1px solid #e0eaf0;border-radius:8px;cursor:pointer}select{width:100%;max-width:360px;background:white;border:1px solid #a9c6d5;padding:9px;border-radius:8px;color:#204c64}.pair{margin:12px 0}.pair label{display:block;font-weight:600;margin-bottom:5px}.feedback{margin-top:10px;border-radius:8px;padding:9px;font-size:14px}.feedback.good{background:#e4f5e9;color:#205d3c}.feedback.bad{background:#fff0e7;color:#84452b}button{padding:12px 17px;border:0;border-radius:9px;background:#16799c;color:white;font-weight:750;font-size:15px;cursor:pointer}button:disabled{opacity:.65;cursor:default}.score{padding:15px;margin:17px 0;font-weight:800;border-radius:12px;background:#eaf3f8}.score.excellent{background:#e0f6e7;color:#18643c}.score.retry{background:#fff1e5;color:#864728}.score.solid{background:#ebf5fb;color:#1b627e}[hidden]{display:none!important}@media(max-width:540px){main{padding:12px 11px 60px}.quiz-question{padding:12px}.timerbar strong{font-size:18px}}</style></head>
<body><header><a class="back" href="ph-wert.html">← Zurück zum Kurs pH-Wert</a></header><main><h1>Kompetenzcheck pH-Wert</h1><p class="intro">5 Aufgaben · 3 Minuten · Multiple Choice und Zuordnung</p><div class="timerbar" id="timerBar" role="timer"><span>Zeit verbleibend</span><strong id="clock">03:00</strong></div><form id="quiz" autocomplete="off"></form><button id="submit" type="button">Wissenscheck auswerten</button><div id="result" class="score" role="status" hidden></div></main><script>
(()=>{'use strict';const questions=[{"type":"mc","q":"Wie wird pH 6 bei 25 °C eingeordnet?","options":["sauer","neutral","alkalisch"],"correct":0,"why":"Bei 25 °C liegt der Neutralpunkt bei pH 7."},{"type":"match","q":"Ordne die Wasserproben ein.","pairs":[["pH 5","sauer"],["pH 7","neutral"],["pH 9","alkalisch"]],"choices":["sauer","neutral","alkalisch"],"why":"Unter pH 7 sauer, bei 7 neutral, darüber alkalisch (bei 25 °C)."},{"type":"mc","q":"Wie stark unterscheidet sich die Wasserstoffionenaktivität bei pH 4 und pH 6?","options":["um den Faktor 100","um den Faktor 2","um den Faktor 10"],"correct":0,"why":"Zwei pH-Stufen entsprechen 10² = 100."},{"type":"match","q":"Ordne den Messverfahren ihre Eigenschaften zu.","pairs":[["Teststreifen","schnelle Abschätzung"],["pH-Elektrode","genaue Messung nach Kalibrierung"],["Indikatorlösung","Farbumschlag"]],"choices":["schnelle Abschätzung","genaue Messung nach Kalibrierung","Farbumschlag"],"why":"Teststreifen sind orientierend, eine kalibrierte Elektrode misst genauer; Indikatorlösungen zeigen einen Farbumschlag."},{"type":"mc","q":"Ein Kunde meldet pH 6,3 bei Kupferleitungen. Was ist fachlich richtig?","options":["Weitere Wasserparameter und Werkstoffregeln prüfen","Sofort eine Enthärtungsanlage einbauen","Nur aus dem pH-Wert einen Rohrschaden sicher ableiten"],"correct":0,"why":"Die Korrosionsbeurteilung berücksichtigt neben pH weitere Wasserwerte und die Werkstoffbedingungen."}];const key='kompetenz-ph-wert-v1';let started=Number(sessionStorage.getItem(key));if(!started||started>Date.now()){started=Date.now();sessionStorage.setItem(key,String(started));}const form=document.getElementById('quiz'),clock=document.getElementById('clock'),bar=document.getElementById('timerBar'),result=document.getElementById('result'),button=document.getElementById('submit');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));form.innerHTML=questions.map((q,i)=>'<fieldset class="quiz-question"><legend>'+(i+1)+'. '+esc(q.q)+'</legend>'+(q.type==='mc'?q.options.map((o,j)=>'<label class="answer"><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join(''):q.pairs.map((p,j)=>'<div class="pair"><label for="match'+i+'-'+j+'">'+esc(p[0])+'</label><select id="match'+i+'-'+j+'"><option value="">Bitte zuordnen</option>'+q.choices.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select></div>').join(''))+'<div class="feedback" id="feedback'+i+'" hidden></div></fieldset>').join('');let finished=false;
function grade(expired){if(finished)return;finished=true;let score=0;questions.forEach((q,i)=>{let correct=false;if(q.type==='mc'){const el=form.querySelector('input[name="q'+i+'"]:checked');correct=!!el&&Number(el.value)===q.correct}else correct=q.pairs.every((p,j)=>form.querySelector('#match'+i+'-'+j).value===p[1]);if(correct)score++;let el=document.getElementById('feedback'+i);el.hidden=false;el.className='feedback '+(correct?'good':'bad');el.textContent=(correct?'Richtig. ':'Noch nicht richtig. ')+q.why;});form.querySelectorAll('input,select').forEach(el=>el.disabled=true);button.disabled=true;button.textContent=expired?'Zeit abgelaufen':'Ausgewertet';bar.classList.toggle('ended',expired);result.hidden=false;result.className='score '+(score===5?'excellent':score<3?'retry':'solid');result.textContent=(expired?'Zeit abgelaufen · ':'')+(score===5?'👍 5 von 5 – hervorragend!':score<3?'🏅 '+score+' von 5 – Probier’s noch einmal!':score+' von 5 – gut gearbeitet!');}
function tick(){const left=Math.max(0,180-Math.floor((Date.now()-started)/1000));clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left===0)grade(true);}
button.addEventListener('click',()=>grade(false));document.addEventListener('visibilitychange',tick);setInterval(tick,500);tick();
})();</script></body></html>
