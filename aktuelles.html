<!doctype html><html lang='de'><head><meta charset='utf-8'><title>Aktuelles</title><style>
:root{--ink:#172634;--muted:#617484;--navy:#102c43;--blue:#23658b;--accent:#ee9b32;--line:#dbe5ec;--soft:#edf4f8}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f5f8fb;color:var(--ink)}
.container{max-width:1250px;margin:auto;padding:0 22px}header{background:var(--navy);color:white}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{color:white;text-decoration:none}.brand small{display:block;color:#bfd2df}.menu a{color:white;text-decoration:none;font-weight:700}
.section{padding:36px 0}.section-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:20px}.section-head p{color:var(--muted)}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#eaf3f8;color:var(--blue);font-weight:800;font-size:.82rem}
.btn{display:inline-flex;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:800;border:1px solid #c1d3df;color:var(--blue);background:white}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.topic-card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:inherit}
.topic-card p{color:var(--muted);line-height:1.5}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
details{background:white;border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}summary{padding:16px 18px;font-weight:800;cursor:pointer}.link-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 16px}.link-item{background:#f8fbfd;border:1px solid var(--line);padding:12px;border-radius:12px}
footer{background:#0f273a;color:#aec1cf;padding:24px 0;margin-top:28px}@media(max-width:800px){.topic-grid,.grid-3,.link-list{grid-template-columns:1fr}.section-head{display:block}}
</style></head><body><header><div class='container nav'><a class='brand' href='index.html'><strong>Lernwerkstatt Sanitärtechnik</strong><small>11. Klasse</small></a></div></header><main><section class='section'><div class='container'><div class='card'><h2>Aktuelles</h2><p>Hier kannst du Hinweise zur laufenden Blockwoche ergänzen.</p></div></div></section></main></body></html>
