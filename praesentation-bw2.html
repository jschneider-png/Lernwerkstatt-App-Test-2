<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Präsentationen · Blockwoche 2</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#15354b;background:#eaf1f5}*{box-sizing:border-box}body{margin:0}.bar{padding:13px 22px;background:#0e3450;color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.bar a{color:#fff}.wrap{max-width:1050px;margin:22px auto;padding:0 16px}.slide{min-height:560px;background:#fff;border-radius:21px;padding:clamp(26px,5vw,64px);box-shadow:0 18px 55px #15354b22;display:flex;flex-direction:column;justify-content:center;border-top:12px solid #1f7296}.eyebrow{color:#1f7296;text-transform:uppercase;letter-spacing:.12em;font-weight:900}h1{font-size:clamp(2rem,4vw,3rem);line-height:1.13;margin:18px 0}p{font-size:clamp(1.16rem,2.2vw,1.5rem);line-height:1.65;white-space:pre-line}.tip{background:#eaf4f8;border-left:5px solid #ee9b32;padding:17px 20px;border-radius:10px;font-size:clamp(1rem,1.8vw,1.22rem);line-height:1.55;margin-top:24px}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;flex-wrap:wrap}button,.pick{border:0;border-radius:11px;background:#1f7296;color:white;font-weight:800;padding:13px 19px;cursor:pointer;font-size:1rem}button:disabled{opacity:.35;cursor:default}.pick{background:#fff;color:#0e3450;max-width:100%;border:1px solid #bbcfda}#counter{font-weight:800}small{opacity:.8}@media(max-width:650px){.slide{min-height:65vh}.bar{font-size:.9rem}.controls{justify-content:center}}@media print{.bar,.controls{display:none}.slide{box-shadow:none;min-height:90vh;break-after:page}}</style></head><body><div class="bar"><a href="lernpfad.html?bw=2">← Zurück zum Lernpfad</a><strong>📽️ Lernwerkstatt · Blockwoche 2</strong><label>Stunde <select id="hour" class="pick"></select></label></div><main class="wrap"><article class="slide" id="slide" aria-live="polite"><div class="eyebrow" id="eye"></div><h1 id="title"></h1><p id="body"></p><div class="tip" id="tip"></div></article><nav class="controls" aria-label="Foliensteuerung"><button id="prev">← Zurück</button><span id="counter"></span><button id="next">Weiter →</button></nav><small>Bedienung: Pfeiltasten ← / → oder Buttons. Jede Stunde enthält eine eigene Präsentation mit Kundenauftrag.</small></main><script>
const DATA=[{"title":"Eigenschaften von Trinkwasser","slides":[["Kundenauftrag: Was ist mit unserem Wasser los?","Familie Berger berichtet: Das Trinkwasser hinterlässt weiße Ränder am Wasserhahn. Der Wasserkocher setzt Kalk an. Ist das Wasser gesundheitsschädlich?","Euer Auftrag: Bereitet eine verständliche Erstberatung vor. Unterscheidet beobachtete Erscheinungen von Messwerten und schlagt geeignete Prüfungen vor."],["Was muss Trinkwasser leisten?","Trinkwasser muss gesundheitlich unbedenklich, genusstauglich und rein sein. Anforderungen regelt die Trinkwasserverordnung. Nicht jede optische Veränderung bedeutet automatisch eine Gesundheitsgefahr.","Unterscheidet: hygienische Qualität, chemische Zusammensetzung und technische Auswirkungen in der Installation."],["Wasser als Lösungsmittel","Wasser ist ein polares Molekül (H₂O). Darum können viele Salze als gelöste Ionen vorliegen. Wasser transportiert auch gelöste Gase, z. B. Sauerstoff und Kohlenstoffdioxid.","Merke: Gelöste Ionen sieht man nicht ohne Weiteres. Klares Wasser ist nicht automatisch frei von Inhaltsstoffen."],["Diese Ionen solltet ihr kennen","Calcium: Ca²⁺; Magnesium: Mg²⁺; Natrium: Na⁺; Chlorid: Cl⁻; Hydrogencarbonat: HCO₃⁻; Sulfat: SO₄²⁻.","Ca²⁺ und Mg²⁺ bestimmen maßgeblich die Wasserhärte. HCO₃⁻ spielt beim Kalk-Kohlensäure-Gleichgewicht eine wichtige Rolle."],["Drei Maße für Inhaltsstoffe","mg/l beschreibt die Masse pro Liter. mmol/l beschreibt die Stoffmenge pro Liter. 1 mmol = 0,001 mol.","Beispiel: 40,08 mg/l Calcium entsprechen 1,00 mmol/l Ca²⁺. 24,31 mg/l Magnesium entsprechen 1,00 mmol/l Mg²⁺."],["Kalk und Temperatur","Beim Erwärmen kann sich Kalk (Calciumcarbonat, CaCO₃) abscheiden, je nach Zusammensetzung und Gleichgewicht des Wassers. An Heizflächen kann dies Beläge verursachen.","Kalkbelag ist kein direkter Beweis für eine hygienische Verunreinigung. Beurteilt Betrieb und Wasseranalyse getrennt."],["Warum Korrosion ein anderes Thema ist","Korrosion hängt unter anderem von Werkstoff, Temperatur, Sauerstoff, pH-Wert, Salzgehalt und Betriebsbedingungen ab.","Hohe Härte allein erklärt Korrosion nicht. Ein auffälliger Geschmack, Geruch oder eine Färbung sollte fachgerecht untersucht werden."],["Messwerte der Familie Berger","Labor-/Versorgerdaten für den Übungsfall: Calcium 80 mg/l; Magnesium 24 mg/l; pH-Wert 7,4; Leitfähigkeit 710 µS/cm. Beobachtung: Kalkbeläge an Armaturen.","Auftrag: Ordnet jeden Wert einer physikalischen oder chemischen Eigenschaft zu. Welche Angaben fehlen für eine vollständige Trinkwasserbeurteilung?"],["Kundenantwort – Teil 1","Formuliert in vier Sätzen: Was erklärt den Kalk? Was kann man aus dem pH-Wert allein nicht folgern? Welche Dokumente oder Messungen fordert ihr an? Welche Sofortmaßnahme ist sinnvoll?","Ergebnis sichern: Eine begründete Erstdiagnose, aber noch keine pauschale Empfehlung zum Einbau einer Anlage."]]},{"title":"Wasserhärte","slides":[["Kundenauftrag: Wie hart ist das Wasser?","Familie Berger fragt: „Unser Wasser enthält 80 mg/l Calcium und 24 mg/l Magnesium. Wie hart ist das in °dH, und brauchen wir eine Enthärtung?“","Am Ende berechnet ihr die Gesamthärte, ordnet den Härtebereich zu und erläutert Vor- und Nachteile."],["Woher kommt Wasserhärte?","Wasserhärte ist wesentlich durch die Konzentrationen gelöster Erdalkalimetallionen bestimmt – im Trinkwasser hauptsächlich Calcium (Ca²⁺) und Magnesium (Mg²⁺).","Wasserhärte ist nicht gleich Kalkmenge auf einer Oberfläche. Ablagerungen hängen auch von Erwärmung und Betriebsweise ab."],["Einheiten: mg/l, mmol/l und °dH","mg/l = Masse pro Liter; mmol/l = Stoffmenge pro Liter; °dH = traditionelle Einheit der Wasserhärte.","Für die Gesamthärte zählt hier die Summe der Stoffmengenkonzentrationen von Ca²⁺ und Mg²⁺."],["Warum teilen wir durch 40,08 bzw. 24,31?","mg/l sagt: Wie viele Milligramm eines Stoffes stecken in einem Liter? mmol/l sagt: Wie viele Millimol Teilchen stecken in einem Liter? Ein Millimol ist ein Tausendstel Mol. 1 mmol Calciumionen besitzt eine Masse von rund 40,08 mg; 1 mmol Magnesiumionen von rund 24,31 mg.","Diese Werte stammen aus den molaren Massen der Elemente im Periodensystem: Calcium 40,08 g/mol, Magnesium 24,31 g/mol. Die zweifache Ladung (²⁺) ändert die Masse für diese Schulrechnung praktisch nicht."],["Umrechnung Schritt für Schritt: Calcium","Familie Berger: 80 mg Calciumionen pro Liter. 1 mmol Ca²⁺ wiegt 40,08 mg. Wie oft passen 40,08 mg in 80 mg? Rechnung: 80 mg/l ÷ 40,08 mg/mmol = 1,996 mmol/l ≈ 2,00 mmol/l Ca²⁺.","Einheitenprobe: (mg/l) ÷ (mg/mmol) = mmol/l. Deshalb steht am Ende mmol/l und nicht mg/l."],["Umrechnung Schritt für Schritt: Magnesium","Familie Berger: 24 mg Magnesiumionen pro Liter. 1 mmol Mg²⁺ wiegt 24,31 mg. Rechnung: 24 mg/l ÷ 24,31 mg/mmol = 0,987 mmol/l ≈ 0,99 mmol/l Mg²⁺.","Obwohl 24 mg/l weniger ist als 80 mg/l, zählt Magnesium für die Gesamthärte mit seiner Stoffmenge in mmol/l. Addiert werden anschließend 2,00 + 0,99 ≈ 2,99 mmol/l."],["Umgekehrt: Von mmol/l zu mg/l","Wenn die Stoffmengenkonzentration gegeben ist, multiplizierst du mit der Masse von 1 mmol: Calcium in mg/l = mmol/l × 40,08 mg/mmol; Magnesium in mg/l = mmol/l × 24,31 mg/mmol.","Kontrolle: 2,00 mmol/l Ca²⁺ × 40,08 ≈ 80,16 mg/l. 0,99 mmol/l Mg²⁺ × 24,31 ≈ 24,07 mg/l. Kleine Unterschiede entstehen durch Rundung."],["Die Gesamthärte berechnen","Gesamthärte ≈ c(Ca²⁺) + c(Mg²⁺) = 2,00 + 0,99 ≈ 2,99 mmol/l.","Rechnet ohne vorzeitiges Runden; bei realen Analysen können weitere Erdalkalimetalle vorkommen."],["Beispiel: 15 °dH in mmol/l und mg/l","1 °dH ≈ 0,1783 mmol/l Gesamthärte. Bei 15 °dH: 15 × 0,1783 = 2,6745 ≈ 2,67 mmol/l. Als Calciumcarbonat-Äquivalent entspricht das etwa 268 mg/l CaCO₃.","Wichtig: 268 mg/l ist NICHT die Calciumkonzentration! Aus °dH allein ist unbekannt, wie viel Calcium bzw. Magnesium im Wasser ist. Bei Berger: (2,00 + 0,99) × 5,6 ≈ 16,7 °dH."],["Härtebereiche in Deutschland","Weich: unter 1,5 mmol/l (unter 8,4 °dH). Mittel: 1,5 bis 2,5 mmol/l (8,4 bis 14 °dH). Hart: über 2,5 mmol/l (über 14 °dH).","Das Berger-Wasser liegt mit rund 2,99 mmol/l im Bereich „hart“."],["Warum ist hartes Wasser technisch relevant?","Bei der Warmwasserbereitung können Kalkablagerungen zunehmen. Das beeinflusst unter Umständen Heizflächen, Armaturen und Wartungsaufwand.","Hartes Wasser ist nicht automatisch gesundheitsgefährdend. Vermeidet die Aussage „je härter, desto schlechter“."],["Übungsrechnung zum Vergleich","Ein zweiter Kunde hat 48 mg/l Ca²⁺ und 12 mg/l Mg²⁺. Bestimmt die beiden mmol/l-Werte, die Gesamthärte, °dH und den Härtebereich.","Rechenhilfe: 48/40,08 ≈ 1,20; 12/24,31 ≈ 0,49; Gesamt ≈ 1,69 mmol/l ≈ 9,5 °dH: mittel."],["Kundenantwort – Teil 2","Gebt der Familie Berger das Ergebnis: ca. 2,99 mmol/l bzw. 16,7 °dH (hart). Erklärt, was der Härtebereich praktisch bedeutet.","Entscheidet noch nicht endgültig über eine Enthärtungsanlage: Verbrauch, Warmwassertemperatur, Wartung und Anforderungen der Installation gehören zur Beratung."]]},{"title":"Der pH-Wert","slides":[["Kundenauftrag: Ist pH 7,4 problematisch?","Die Analyse der Familie Berger nennt pH 7,4. Eine Nachbarin behauptet: „Das Wasser ist zu sauer und greift die Rohre an.“","Prüft diese Behauptung mit Fachwissen und gebt eine nachvollziehbare Antwort."],["Was misst der pH-Wert?","Der pH-Wert ist ein Maß für die Aktivität der Wasserstoffionen in einer wässrigen Lösung. Für die Schule gilt vereinfacht: pH = −log₁₀[H₃O⁺].","Bei 25 °C gilt als Orientierung: pH 7 neutral, darunter sauer, darüber alkalisch."],["Die logarithmische Skala","Eine Änderung um eine pH-Stufe entspricht ungefähr dem Faktor 10 bei der Wasserstoffionenaktivität.","pH 6 ist in diesem Sinne etwa zehnmal saurer als pH 7. pH 5 etwa hundertmal saurer als pH 7."],["Trinkwasser und pH","Für Trinkwasser ist nach Trinkwasserverordnung grundsätzlich ein pH-Bereich von 6,5 bis 9,5 vorgesehen; spezielle Bedingungen können gelten.","pH 7,4 liegt innerhalb dieses allgemeinen Bereichs. Das allein beweist weder die vollständige Trinkwasserqualität noch die Korrosionssicherheit."],["Was beeinflusst den pH-Wert?","Kohlenstoffdioxid/Kohlensäure, Carbonat-/Hydrogencarbonat-Gleichgewichte, Wasseraufbereitung und Temperatur beeinflussen den pH-Wert.","Der pH-Wert kann sich nach der Probenahme ändern. Professionelle Messung und Probennahme sind entscheidend."],["Korrosion hängt von mehr ab","Werkstoff, Sauerstoff, pH, Leitfähigkeit, Salzverhältnis, Temperatur, Strömung und Nutzungsweise wirken zusammen.","Ein pH-Wert von 7,4 bedeutet nicht: „Korrosion unmöglich“. Und er begründet allein keinen Austausch von Rohrleitungen."],["Messwerte richtig lesen","Berger: pH 7,4, Härte 2,99 mmol/l, Leitfähigkeit 710 µS/cm. Diese Messgrößen erfassen unterschiedliche Eigenschaften.","Aufgabe: Welche Zahl beschreibt Säuregrad, welche Erdalkalimetallionen und welche die elektrische Leitfähigkeit?"],["Prüffall","Probe A: pH 6,4. Probe B: pH 7,4. Probe C: pH 9,6. Vergleicht die Werte mit dem allgemeinen pH-Bereich für Trinkwasser.","Welche Proben wären auffällig? A und C liegen außerhalb des genannten Regelbereichs; eine fachliche Prüfung wäre erforderlich."],["Kundenantwort – Teil 3","Formuliert eine Antwort: Was sagt pH 7,4? Ist die Behauptung der Nachbarin zutreffend? Warum sollten Werkstoffe und weitere Analysedaten berücksichtigt werden?","Ergebnis: pH 7,4 ist für sich genommen kein Beleg für zu saures Wasser."]]},{"title":"Trinkwasserbehandlung","slides":[["Kundenauftrag: Welche Lösung empfehlen wir?","Familie Berger hat 16,7 °dH und Kalk an Warmwasserarmaturen. Ein Verkäufer empfiehlt sofort eine Enthärtungsanlage.","Eure Aufgabe: Prüft mehrere Lösungen und begründet eine bedarfsgerechte, hygienisch sichere Empfehlung."],["Erst analysieren, dann behandeln","Notiert: Wasseranalysen des Versorgers, Anlagenaufbau und Werkstoffe, Warmwassertemperatur, Verbrauch, Wartung und konkrete Beschwerden.","Nicht jede Kalkablagerung macht eine zentrale Trinkwasserbehandlung erforderlich."],["Mechanische Filtration","Ein geeigneter Trinkwasserfilter hält Partikel zurück. Er entfernt gelöste Calcium- und Magnesiumionen nicht.","Merksatz: Ein Partikelfilter ist keine Enthärtungsanlage."],["Ionenaustauscher: So funktioniert Enthärtung","Bei der Natrium-Ionenaustauscher-Enthärtung werden Ca²⁺ und Mg²⁺ am Harz gebunden und im Gegenzug Natriumionen an das Wasser abgegeben.","Vereinfacht: 2 R–Na + Ca²⁺ → R₂–Ca + 2 Na⁺. Für Mg²⁺ läuft ein entsprechender Austausch ab."],["Regeneration und Hygiene","Das Harz wird üblicherweise mit Natriumchlorid-Sole regeneriert. Dabei entsteht salzhaltiges Regenerationsabwasser.","Eine solche Anlage muss fachgerecht geplant, gegen Rückfließen abgesichert, bestimmungsgemäß betrieben und regelmäßig gewartet werden."],["Rechenbeispiel: Natriumzunahme","Bei Enthärtung um 1 mmol/l Erdalkalimetallionen steigt Natrium theoretisch um ca. 46 mg/l: ein Ca²⁺/Mg²⁺ wird gegen zwei Na⁺ ausgetauscht.","Würde Berger vollständig von 2,99 auf 0 mmol/l enthärten, wären es rechnerisch etwa 138 mg/l zusätzliches Natrium. Ausgangsnatrium kommt noch hinzu."],["Betriebsziel statt Null-Härte","In der Praxis wird häufig nur teilweise enthärtet oder verschnitten. Zielwerte hängen von Herstellerangaben, Anlagenschutz und Wasserzusammensetzung ab.","Sehr weiches Wasser ist nicht automatisch die beste Einstellung. Werkstoffverträglichkeit und Regelwerke beachten."],["Andere Maßnahmen","Warmwassersollwerte und hygienische Temperaturanforderungen prüfen; Armaturen reinigen/entkalken; wartungsfreundliche Komponenten auswählen.","Temperaturen nicht auf Kosten des Legionellenschutzes absenken. Eine chemische Dosierung erfordert eigene fachliche Bewertung."],["Vergleich und Entscheidung","Option A: Nur Pflege und Monitoring. Option B: Fachgerecht geplante Teilenthärtung mit Wartung. Option C: Ohne Prüfung eine Anlage installieren.","Vergleicht: Wirksamkeit gegen Kalk, Investition, Betriebskosten, Salz/Wasserverbrauch, Natrium und Hygiene. C ist nicht fachgerecht begründet."],["Abschlussauftrag: Kundenberatung Berger","Erstellt ein Beratungsprotokoll mit: 1. Problem und Befund, 2. Ca²⁺-/Mg²⁺-Umrechnung, 3. Gesamthärte/°dH/Härtebereich, 4. pH-Bewertung, 5. Maßnahmenvergleich, 6. Empfehlung und nächster Prüfschritt.","Daten: Ca²⁺ 80 mg/l, Mg²⁺ 24 mg/l, pH 7,4, 710 µS/cm. Die Entscheidung muss zu den Befunden passen und begründet sein."]]}];const q=new URLSearchParams(location.search);let hour=Math.max(0,Math.min(3,(Number(q.get('stunde'))||1)-1));let index=0;const $=x=>document.getElementById(x);DATA.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+': '+d.title;$('hour').append(o)});function render(){const s=DATA[hour].slides[index];$('hour').value=hour;$('eye').textContent='Stunde '+(hour+1)+' · '+DATA[hour].title;$('title').textContent=s[0];$('body').textContent=s[1];$('tip').textContent=s[2];$('counter').textContent='Folie '+(index+1)+' von '+DATA[hour].slides.length;$('prev').disabled=index===0;$('next').disabled=index===DATA[hour].slides.length-1;history.replaceState(null,'','?stunde='+(hour+1)+'&folie='+(index+1))}function move(n){index=Math.max(0,Math.min(DATA[hour].slides.length-1,index+n));render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('hour').onchange=e=>{hour=Number(e.target.value);index=0;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});index=Math.max(0,Math.min(DATA[hour].slides.length-1,(Number(q.get('folie'))||1)-1));render();
</script></body></html>
