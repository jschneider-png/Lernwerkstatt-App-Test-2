:root{font-family:system-ui,Arial,sans-serif;color:#15354b;background:#eaf1f5}*{box-sizing:border-box}body{margin:0}.bar{padding:13px 22px;background:#0e3450;color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.bar a{color:#fff}.wrap{max-width:1050px;margin:22px auto;padding:0 16px}.slide{min-height:560px;background:#fff;border-radius:21px;padding:clamp(26px,5vw,64px);box-shadow:0 18px 55px #15354b22;display:flex;flex-direction:column;justify-content:center;border-top:12px solid #1f7296}.eyebrow{color:#1f7296;text-transform:uppercase;letter-spacing:.12em;font-weight:900}h1{font-size:clamp(2rem,4vw,3rem);line-height:1.13;margin:18px 0}p{font-size:clamp(1.16rem,2.2vw,1.5rem);line-height:1.65;white-space:pre-line}.tip{background:#eaf4f8;border-left:5px solid #ee9b32;padding:17px 20px;border-radius:10px;font-size:clamp(1rem,1.8vw,1.22rem);line-height:1.55;margin-top:24px}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;flex-wrap:wrap}button,.pick{border:0;border-radius:11px;background:#1f7296;color:white;font-weight:800;padding:13px 19px;cursor:pointer;font-size:1rem}button:disabled{opacity:.35;cursor:default}.pick{background:#fff;color:#0e3450;max-width:100%;border:1px solid #bbcfda}#counter{font-weight:800}small{opacity:.8}@media(max-width:650px){.slide{min-height:65vh}.bar{font-size:.9rem}.controls{justify-content:center}}@media print{.bar,.controls{display:none}.slide{box-shadow:none;min-height:90vh;break-after:page}} .iongraphic{margin-top:22px}.iongraphic svg{display:block;max-width:100%;height:auto}.iongraphic[hidden]{display:none} </style></head><body><div class="bar"><a href="lernpfad.html?bw=2">← Zurück zum Lernpfad</a><strong>📽️ Lernwerkstatt · Blockwoche 2</strong><a href="wasseranalyse-familie-berger.html" target="_blank" rel="noopener">📄 Wasseranalyse Fam. Berger</a><label>Stunde <select id="hour" class="pick"></select></label></div><main class="wrap"><article class="slide" id="slide" aria-live="polite"><div class="eyebrow" id="eye"></div><h1 id="title"></h1><p id="body"></p><div class="tip" id="tip"></div><div id="iongraphic" class="iongraphic" hidden></div></article><nav class="controls" aria-label="Foliensteuerung"><button id="prev">← Zurück</button><span id="counter"></span><button id="next">Weiter →</button></nav><small>Bedienung: Pfeiltasten ← / → oder Buttons. Jede Stunde enthält eine eigene Präsentation mit Kundenauftrag.</small></main><script>
const DATA=[{"title":"Eigenschaften von Trinkwasser","slides":[["Kundenauftrag: Was ist mit unserem Wasser los?","Familie Berger berichtet: Das Trinkwasser hinterlässt weiße Ränder am Wasserhahn. Der Wasserkocher setzt Kalk an. Ist das Wasser gesundheitsschädlich?","Euer Auftrag: Bereitet eine verständliche Erstberatung vor. Unterscheidet beobachtete Erscheinungen von Messwerten und schlagt geeignete Prüfungen vor."],["Was muss Trinkwasser leisten?","Trinkwasser muss gesundheitlich unbedenklich, genusstauglich und rein sein. Anforderungen regelt die Trinkwasserverordnung. Nicht jede optische Veränderung bedeutet automatisch eine Gesundheitsgefahr.","Unterscheidet: hygienische Qualität, chemische Zusammensetzung und technische Auswirkungen in der Installation."],["Wasser als Lösungsmittel","Wasser ist ein polares Molekül (H₂O). Darum können viele Salze als gelöste Ionen vorliegen. Wasser transportiert auch gelöste Gase, z. B. Sauerstoff und Kohlenstoffdioxid.","Merke: Gelöste Ionen sieht man nicht ohne Weiteres. Klares Wasser ist nicht automatisch frei von Inhaltsstoffen."],["Diese Ionen solltet ihr kennen","Calcium: Ca²⁺; Magnesium: Mg²⁺; Natrium: Na⁺; Chlorid: Cl⁻; Hydrogencarbonat: HCO₃⁻; Sulfat: SO₄²⁻.","Ca²⁺ und Mg²⁺ bestimmen maßgeblich die Wasserhärte. HCO₃⁻ spielt beim Kalk-Kohlensäure-Gleichgewicht eine wichtige Rolle."],["Drei Maße für Inhaltsstoffe","mg/l beschreibt die Masse pro Liter. mmol/l beschreibt die Stoffmenge pro Liter. 1 mmol = 0,001 mol.","Beispiel: 40,08 mg/l Calcium entsprechen 1,00 mmol/l Ca²⁺. 24,31 mg/l Magnesium entsprechen 1,00 mmol/l Mg²⁺."],["Kalk und Temperatur","Beim Erwärmen kann sich Kalk (Calciumcarbonat, CaCO₃) abscheiden, je nach Zusammensetzung und Gleichgewicht des Wassers. An Heizflächen kann dies Beläge verursachen.","Kalkbelag ist kein direkter Beweis für eine hygienische Verunreinigung. Beurteilt Betrieb und Wasseranalyse getrennt."],["Warum Korrosion ein anderes Thema ist","Korrosion hängt unter anderem von Werkstoff, Temperatur, Sauerstoff, pH-Wert, Salzgehalt und Betriebsbedingungen ab.","Hohe Härte allein erklärt Korrosion nicht. Ein auffälliger Geschmack, Geruch oder eine Färbung sollte fachgerecht untersucht werden."],["Messwerte der Familie Berger","Labor-/Versorgerdaten für den Übungsfall: Calcium 80 mg/l; Magnesium 24 mg/l; pH-Wert 7,4; Leitfähigkeit 710 µS/cm. Beobachtung: Kalkbeläge an Armaturen.","Auftrag: Ordnet jeden Wert einer physikalischen oder chemischen Eigenschaft zu. Welche Angaben fehlen für eine vollständige Trinkwasserbeurteilung?"],["Kundenantwort – Teil 1","Formuliert in vier Sätzen: Was erklärt den Kalk? Was kann man aus dem pH-Wert allein nicht folgern? Welche Dokumente oder Messungen fordert ihr an? Welche Sofortmaßnahme ist sinnvoll?","Ergebnis sichern: Eine begründete Erstdiagnose, aber noch keine pauschale Empfehlung zum Einbau einer Anlage."]]},{"title":"Wasserhärte","slides":[["Kundenauftrag: Woher kommen die Kalkablagerungen?","Familie Berger entdeckt weiße Beläge an Armaturen und im Wasserkocher. Laut Wasserversorger beträgt die Wasserhärte etwa 15 °dH. Die Familie fragt: Wo kommt der Kalk her? Ist hartes Wasser schlecht? Was können wir tun?","Euer Ziel: Erklärt den Weg des Wassers, die Entstehung der Härte und die Kalkbildung. Nutzt erst danach eine einfache Härte-Umrechnung für die Kundenberatung."],["Der natürliche Wasserkreislauf","Sonnenwärme lässt Wasser aus Meeren, Seen und Böden verdunsten. Wasserdampf kondensiert zu Wolken; Niederschlag fällt auf die Erde. Wasser fließt oberirdisch ab oder versickert und gelangt als Grundwasser über Quellen, Flüsse und Meere zurück.","Wichtig: Beim Verdunsten bleiben die meisten gelösten Salze zurück. Erst auf dem Weg durch Boden und Gestein nimmt das Wasser Mineralstoffe auf."],["Warum wird Regenwasser auf seinem Weg härter?","Regen- und Bodenwasser nimmt Kohlenstoffdioxid (CO₂) auf. Daraus bildet sich teilweise Kohlensäure. Beim Versickern durch kalkhaltiges Gestein können Calcium- und Magnesiumverbindungen gelöst werden.","Grundwasser ist deshalb je nach geologischem Untergrund unterschiedlich hart. Wasser aus kalkarmen Gesteinen ist häufig weicher als Wasser aus Kalk- oder Dolomitgebieten."],["Calcium und Magnesium: die Härtebildner","Gelöstes Calcium liegt als Ca²⁺, Magnesium als Mg²⁺ im Wasser vor. Diese positiv geladenen Ionen heißen Erdalkalimetallionen. Sie verursachen den größten Teil der natürlichen Wasserhärte.","Hydrogencarbonat (HCO₃⁻) ist häufig das passende negativ geladene Ion. Calcium und Magnesium sind natürliche Wasserbestandteile, keine Verschmutzung."],["Was bedeutet Gesamthärte?","Die Gesamthärte erfasst im Wesentlichen die Summe der gelösten Calcium- und Magnesiumionen. Bei der in Trinkwasser üblichen Näherung gilt: Gesamthärte in mmol/l ≈ c(Ca²⁺) + c(Mg²⁺).","Je mehr Ca²⁺ und Mg²⁺ vorhanden sind, desto höher ist die Gesamthärte. Nicht verwechseln: Gesamthärte beschreibt gelöste Ionen – Kalkbeläge sind feste Ablagerungen."],["Härtebereiche verständlich einordnen","Weich: weniger als 1,5 mmol/l bzw. 8,4 °dH. Mittel: 1,5 bis 2,5 mmol/l bzw. 8,4 bis 14 °dH. Hart: mehr als 2,5 mmol/l bzw. 14 °dH.","Familie Berger: 15 °dH = Härtebereich hart. Hartes Wasser ist nicht automatisch gesundheitsschädlich, kann aber bei Erwärmung stärkere Kalkablagerungen begünstigen."],["Was ist das Kalk-Kohlensäure-Gleichgewicht?","Im Wasser stehen gelöstes CO₂/Kohlensäure, Hydrogencarbonat (HCO₃⁻), Carbonat und Calciumcarbonat (CaCO₃) in einem chemischen Gleichgewicht. Je nach Bedingungen kann Kalk gelöst bleiben oder als Feststoff ausfallen.","Merksatz: Das Gleichgewicht beeinflusst, ob Wasser Kalk löst, mit Kalk im Gleichgewicht steht oder Kalk abscheidet. Temperatur, CO₂-Gehalt und pH-Wert spielen dabei zusammen."],["Wie kann Kalk im Boden gelöst werden?","Vereinfacht: CaCO₃ + CO₂ + H₂O ⇌ Ca²⁺ + 2 HCO₃⁻. Links: fester Kalkstein, Kohlenstoffdioxid und Wasser. Rechts: gelöstes Calcium und Hydrogencarbonat.","Bei CO₂-haltigem Wasser verschiebt sich das Gleichgewicht häufig in Richtung Lösung: Auf dem Weg durch Kalkgestein nimmt das Wasser Calcium auf. Bei Magnesium wirken ähnliche geochemische Prozesse."],["Warum entstehen Kalkbeläge beim Erwärmen?","Wird Wasser erwärmt und CO₂ ausgetrieben, können sich die Gleichgewichte verändern. Calciumcarbonat (CaCO₃) kann ausfallen und sich an Heizflächen und Armaturen ablagern. Vereinfacht lässt sich die Reaktion auch in umgekehrter Richtung lesen.","Ein weißer Kalkbelag ist daher nicht gleichbedeutend mit einer Schadstoffbelastung. Temperatur und Zusammensetzung entscheiden mit – Härte allein genügt nicht zur Vorhersage."],["Kalkabscheidung und Korrosion unterscheiden","Kalkabscheidung bedeutet: Festes Calciumcarbonat bildet Beläge. Korrosion bedeutet: Ein Werkstoff wird chemisch oder elektrochemisch angegriffen. Beide Vorgänge sind verschieden, können sich in einer Installation aber beeinflussen.","Für die Praxis müssen Werkstoff, Temperatur, Wasserbeschaffenheit, Betriebsbedingungen und Hygiene gemeinsam betrachtet werden."],["Welche Maßeinheiten braucht ihr?","mg/l bedeutet: Milligramm eines bestimmten Stoffes pro Liter Wasser (Massekonzentration). mmol/l bedeutet: Millimol Teilchen pro Liter (Stoffmengenkonzentration). °dH ist eine traditionelle Einheit für Wasserhärte.","Faustregel: 1 °dH ≈ 0,178 mmol/l Gesamthärte; 1 mmol/l Gesamthärte ≈ 5,6 °dH. Werte in mg/l muss man immer einem Stoff zuordnen."],["Ein Rechenbeispiel genügt: 15 °dH","Berger: 15 °dH × 0,1783 ≈ 2,67 mmol/l Gesamthärte. Als Calciumcarbonat-Äquivalent sind das rund 268 mg/l CaCO₃. Diese Zahl bezeichnet nicht die echte Konzentration an festem Kalk im Wasser.","Aus 15 °dH allein lässt sich nicht erkennen, wie viele mg/l Calcium und wie viele mg/l Magnesium vorliegen. Dazu benötigt ihr eine Wasseranalyse."],["Woher kommen die Zahlen 40,08 und 24,31?","Im Periodensystem steht bei Calcium (Ca, Ordnungszahl 20) die molare Masse 40,08 g/mol. Das heißt: 1 mol Calcium hat eine Masse von 40,08 g. Für 1 mmol (ein Tausendstel mol) sind es 40,08 mg. Bei Magnesium (Mg, Ordnungszahl 12) gilt entsprechend: 24,31 g/mol bzw. 24,31 mg/mmol.","Darum teilen wir bei der Umrechnung von mg/l in mmol/l für Calcium durch 40,08 mg/mmol und für Magnesium durch 24,31 mg/mmol. Die Zahlen sind keine willkürlichen Formeln, sondern stammen aus dem Periodensystem."],["Wenn Calcium und Magnesium in mg/l vorliegen","Beispiel einer Wasseranalyse: Calcium 80 mg/l; Magnesium 24 mg/l. 1 mmol Ca²⁺ wiegt 40,08 mg; 1 mmol Mg²⁺ wiegt 24,31 mg. Daher: Ca²⁺ = 80 ÷ 40,08 ≈ 2,00 mmol/l; Mg²⁺ = 24 ÷ 24,31 ≈ 0,99 mmol/l. Zusammen ≈ 2,99 mmol/l ≈ 16,7 °dH.","Warum teilen? Ihr berechnet, wie viele Portionen à 40,08 mg bzw. 24,31 mg in der jeweiligen Masse stecken. Hier nur als Zusatzbeispiel – wichtiger ist das Verständnis der Gesamthärte."],["Kundenauftrag lösen: Erklärt und beratet","Erstellt für Familie Berger eine kurze fachliche Kundenantwort: 1. Beschreibt den Wasserkreislauf und die Aufnahme von Mineralstoffen. 2. Erklärt Calcium, Magnesium und Gesamthärte. 3. Erläutert das Kalk-Kohlensäure-Gleichgewicht und die Ablagerungen beim Erwärmen. 4. Ordnet 15 °dH ein. 5. Empfehlt sinnvolle weitere Prüfschritte.","Begründete Empfehlung: Analyse des Versorgers und Betriebsbedingungen prüfen; Kalkbeläge fachgerecht entfernen, Warmwasserbereitung und Wartung beurteilen. Eine Enthärtungsanlage nicht allein wegen 15 °dH pauschal empfehlen."]]},{"title":"Der pH-Wert","slides":[["Kundenauftrag: Ist pH 7,4 problematisch?","Familie Berger liest in ihrer Wasseranalyse pH 7,4. Eine Nachbarin sagt: „Das Wasser ist zu sauer und greift die Rohre an.“","Prüft diese Aussage. Erklärt der Familie den pH-Wert ohne komplizierte Mathematik."],["pH-Wert: sauer, neutral oder alkalisch?","Der pH-Wert zeigt, ob eine wässrige Lösung eher sauer, neutral oder alkalisch (basisch) ist. Als einfache Orientierung bei 25 °C: pH 7 ist neutral, Werte darunter sind sauer, Werte darüber alkalisch.","Beispiele: Zitronensaft etwa pH 2, reines Wasser etwa pH 7, Seifenlösung oft pH 9–10. Das sind typische Orientierungswerte, keine festen Messwerte."],["Was passiert im Wasser? H₃O⁺ und OH⁻","Wassermoleküle können Protonen übertragen: 2 H₂O ⇌ H₃O⁺ + OH⁻. Dabei entstehen Oxoniumionen (H₃O⁺) und Hydroxidionen (OH⁻). In einer neutralen Lösung sind ihre Aktivitäten bei 25 °C gleich groß. In saurer Lösung überwiegt H₃O⁺, in alkalischer Lösung OH⁻.","Entscheidend: Der pH-Wert ist direkt über die Aktivität von H₃O⁺ definiert. Wie wissen wir das? Säure-Base-Indikatoren zeigen einen Farbumschlag; ein kalibriertes pH-Messgerät bestimmt den Wert über eine elektrische Spannung. Die Skizze darunter veranschaulicht die Unterschiede."],["Warum verändert sich der pH-Wert?","Sauer bedeutet: mehr wirksame H₃O⁺-Ionen als in neutralem Wasser. Alkalisch bedeutet: weniger H₃O⁺ und entsprechend mehr OH⁻. Beispiel: Gibt man eine Säure ins Wasser, überträgt sie Protonen auf Wassermoleküle – dabei entstehen zusätzliche H₃O⁺-Ionen.","Denkfrage: Warum ist pH 6 saurer als pH 7? Erst die Teilchen verstehen, dann den Faktor 10 auf der nächsten Folie kennenlernen."],["Der wichtige Trick: Jede pH-Stufe bedeutet Faktor 10!","Von pH 7 auf pH 6: Die Wasserstoffionen-Aktivität ist 10-mal so groß. Von pH 7 auf pH 5: 10 × 10 = 100-mal so groß. Von pH 7 auf pH 4: 10 × 10 × 10 = 1.000-mal so groß.","Bei einer pH-Stufe nach oben ist es jeweils ein Zehntel. Man zählt also Zehnerschritte – die Logarithmusformel müsst ihr dafür nicht berechnen."],["So könnt ihr euch die pH-Skala merken","pH 4 → pH 5 → pH 6 → pH 7 → pH 8 → pH 9. Nach rechts wird die Wasserstoffionen-Aktivität pro Schritt zehnmal kleiner; nach links pro Schritt zehnmal größer.","Denkaufgabe: pH 5 verglichen mit pH 7? Zwei Schritte nach links, also 10 × 10 = 100-mal höhere Wasserstoffionen-Aktivität. Umgangssprachlich sagt man oft „100-mal saurer“."],["Was hat das mit den Teilchen im Wasser zu tun?","Saure Lösungen besitzen eine höhere Aktivität an Oxoniumionen (H₃O⁺). H₃O⁺ ist ein Wassermolekül mit einem zusätzlichen Wasserstoffion. Je mehr davon wirksam vorhanden sind, desto niedriger ist der pH-Wert.","Für unsere Berufsschul-Aufgaben genügt die Regel: niedriger pH → stärker sauer; ein pH-Schritt → Faktor 10. Die Formel mit „log“ braucht ihr nicht."],["Praxisvergleich: Leitungswasser und Mineralwasser","Leitungswasser liegt häufig etwa bei pH 7,0 bis 8,5 (je nach Region und Aufbereitung). Kohlensäurehaltiges Mineralwasser hat oft einen niedrigeren pH-Wert – beispielsweise etwa 5,5 bis 6,7, abhängig von CO₂-Gehalt und Mineralstoffen. Stilles Mineralwasser kann näher am neutralen Bereich liegen.","Warum? Gelöstes CO₂ beeinflusst das Kohlensäure-Gleichgewicht und senkt häufig den pH-Wert. Ein niedrigerer pH-Wert bei Sprudel ist nicht automatisch ein Qualitätsmangel. Vergleicht konkrete Etiketten oder Messtests statt alle Mineralwässer gleichzusetzen."],["Trinkwasser und pH-Wert","Nach der Trinkwasserverordnung liegt der allgemeine zulässige pH-Bereich bei 6,5 bis 9,5; besondere Bedingungen können zusätzlich gelten.","Familie Berger hat pH 7,4: Der Wert liegt im allgemeinen Bereich. Ob die Installation korrosionssicher ist, lässt sich daraus allein nicht beurteilen."],["Was beeinflusst den pH-Wert?","Kohlenstoffdioxid, Kohlensäure und Hydrogencarbonat stehen im Wasser in einem Gleichgewicht. Auch Temperatur und Aufbereitungsverfahren können den pH-Wert beeinflussen.","Verbindung zur Wasserhärte: Das Kalk-Kohlensäure-Gleichgewicht beeinflusst sowohl die Kalklösung als auch die Kalkabscheidung."],["pH-Wert und Korrosion: Nicht verwechseln","Korrosion hängt unter anderem von Rohrwerkstoff, Sauerstoff, pH-Wert, gelösten Salzen, Temperatur und Betriebsbedingungen ab.","Ein pH von 7,4 bedeutet weder „zu sauer“ noch automatisch „keine Korrosion“. Fachleute bewerten mehrere Wasserparameter zusammen."],["Kurzer Praxis-Check","Probe A: pH 6,4. Probe B: pH 7,4. Probe C: pH 9,6. Welche Proben liegen außerhalb des allgemeinen Bereichs 6,5–9,5? Und wie groß ist der Unterschied der Wasserstoffionen-Aktivität zwischen pH 6 und pH 8?","Antwort: A und C sind außerhalb. Zwischen pH 6 und pH 8 liegen zwei Stufen: bei pH 6 ist die Aktivität etwa 100-mal größer. Eine Abweichung erfordert fachliche Prüfung."],["Kundenauftrag lösen: Familie Berger beraten","Erklärt in 4–5 Sätzen: Was bedeutet pH 7,4? Warum ist der Unterschied zwischen pH 6 und pH 7 ein Faktor 10? Was kann man über die Rohre aus dem pH-Wert allein nicht sagen?","Kundengerecht formulieren – ohne Logarithmus. Ergebnis: pH 7,4 ist kein Hinweis auf übermäßig saures Wasser. Für Korrosionsfragen sind weitere Angaben nötig."]]},{"title":"Trinkwasserbehandlung","slides":[["Kundenauftrag: Welche Lösung empfehlen wir?","Familie Berger hat 16,7 °dH und Kalk an Warmwasserarmaturen. Ein Verkäufer empfiehlt sofort eine Enthärtungsanlage.","Eure Aufgabe: Prüft mehrere Lösungen und begründet eine bedarfsgerechte, hygienisch sichere Empfehlung."],["Erst analysieren, dann behandeln","Notiert: Wasseranalysen des Versorgers, Anlagenaufbau und Werkstoffe, Warmwassertemperatur, Verbrauch, Wartung und konkrete Beschwerden.","Nicht jede Kalkablagerung macht eine zentrale Trinkwasserbehandlung erforderlich."],["Mechanische Filtration","Ein geeigneter Trinkwasserfilter hält Partikel zurück. Er entfernt gelöste Calcium- und Magnesiumionen nicht.","Merksatz: Ein Partikelfilter ist keine Enthärtungsanlage."],["Ionenaustauscher: So funktioniert Enthärtung","Bei der Natrium-Ionenaustauscher-Enthärtung werden Ca²⁺ und Mg²⁺ am Harz gebunden und im Gegenzug Natriumionen an das Wasser abgegeben.","Vereinfacht: 2 R–Na + Ca²⁺ → R₂–Ca + 2 Na⁺. Für Mg²⁺ läuft ein entsprechender Austausch ab."],["Regeneration und Hygiene","Das Harz wird üblicherweise mit Natriumchlorid-Sole regeneriert. Dabei entsteht salzhaltiges Regenerationsabwasser.","Eine solche Anlage muss fachgerecht geplant, gegen Rückfließen abgesichert, bestimmungsgemäß betrieben und regelmäßig gewartet werden."],["Rechenbeispiel: Natriumzunahme","Bei Enthärtung um 1 mmol/l Erdalkalimetallionen steigt Natrium theoretisch um ca. 46 mg/l: ein Ca²⁺/Mg²⁺ wird gegen zwei Na⁺ ausgetauscht.","Würde Berger vollständig von 2,99 auf 0 mmol/l enthärten, wären es rechnerisch etwa 138 mg/l zusätzliches Natrium. Ausgangsnatrium kommt noch hinzu."],["Betriebsziel statt Null-Härte","In der Praxis wird häufig nur teilweise enthärtet oder verschnitten. Zielwerte hängen von Herstellerangaben, Anlagenschutz und Wasserzusammensetzung ab.","Sehr weiches Wasser ist nicht automatisch die beste Einstellung. Werkstoffverträglichkeit und Regelwerke beachten."],["Andere Maßnahmen","Warmwassersollwerte und hygienische Temperaturanforderungen prüfen; Armaturen reinigen/entkalken; wartungsfreundliche Komponenten auswählen.","Temperaturen nicht auf Kosten des Legionellenschutzes absenken. Eine chemische Dosierung erfordert eigene fachliche Bewertung."],["Vergleich und Entscheidung","Option A: Nur Pflege und Monitoring. Option B: Fachgerecht geplante Teilenthärtung mit Wartung. Option C: Ohne Prüfung eine Anlage installieren.","Vergleicht: Wirksamkeit gegen Kalk, Investition, Betriebskosten, Salz/Wasserverbrauch, Natrium und Hygiene. C ist nicht fachgerecht begründet."],["Abschlussauftrag: Kundenberatung Berger","Erstellt ein Beratungsprotokoll mit: 1. Problem und Befund, 2. Ca²⁺-/Mg²⁺-Umrechnung, 3. Gesamthärte/°dH/Härtebereich, 4. pH-Bewertung, 5. Maßnahmenvergleich, 6. Empfehlung und nächster Prüfschritt.","Daten: Ca²⁺ 80 mg/l, Mg²⁺ 24 mg/l, pH 7,4, 710 µS/cm. Die Entscheidung muss zu den Befunden passen und begründet sein."]]}];const q=new URLSearchParams(location.search);let hour=Math.max(0,Math.min(3,(Number(q.get('stunde'))||1)-1));let index=0;const $=x=>document.getElementById(x);DATA.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+': '+d.title;$('hour').append(o)});const ION_GRAPHIC="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 940 260\" role=\"img\" aria-label=\"Vergleich saure, neutrale und alkalische Lösung: H3O plus und OH minus\">\n<rect width=\"940\" height=\"260\" rx=\"15\" fill=\"#f0f6fa\"/>\n<g font-family=\"Arial, sans-serif\" text-anchor=\"middle\">\n<rect x=\"15\" y=\"14\" width=\"292\" height=\"216\" rx=\"14\" fill=\"#ffe8e5\"/>\n<rect x=\"324\" y=\"14\" width=\"292\" height=\"216\" rx=\"14\" fill=\"#e8eef4\"/>\n<rect x=\"633\" y=\"14\" width=\"292\" height=\"216\" rx=\"14\" fill=\"#e2f1fd\"/>\n<g font-size=\"23\" font-weight=\"bold\" fill=\"#15354b\"><text x=\"161\" y=\"50\">sauer · pH &lt; 7</text><text x=\"470\" y=\"50\">neutral · pH 7</text><text x=\"779\" y=\"50\">alkalisch · pH &gt; 7</text></g>\n<g font-size=\"17\"><text x=\"161\" y=\"77\">mehr H₃O⁺</text><text x=\"470\" y=\"77\">gleich viele</text><text x=\"779\" y=\"77\">mehr OH⁻</text></g>\n<g font-size=\"19\" font-weight=\"bold\">\n<g fill=\"#cc4b46\"><text x=\"65\" y=\"118\">H₃O⁺</text><text x=\"160\" y=\"118\">H₃O⁺</text><text x=\"254\" y=\"118\">H₃O⁺</text><text x=\"65\" y=\"164\">H₃O⁺</text><text x=\"160\" y=\"164\">H₃O⁺</text><text x=\"372\" y=\"118\">H₃O⁺</text><text x=\"470\" y=\"164\">H₃O⁺</text><text x=\"681\" y=\"118\">H₃O⁺</text></g>\n<g fill=\"#1974b5\"><text x=\"254\" y=\"164\">OH⁻</text><text x=\"470\" y=\"118\">OH⁻</text><text x=\"372\" y=\"164\">OH⁻</text><text x=\"569\" y=\"164\">H₃O⁺</text><text x=\"569\" y=\"118\">OH⁻</text><text x=\"778\" y=\"118\">OH⁻</text><text x=\"876\" y=\"118\">OH⁻</text><text x=\"681\" y=\"164\">OH⁻</text><text x=\"778\" y=\"164\">OH⁻</text><text x=\"876\" y=\"164\">OH⁻</text></g>\n</g><g font-size=\"14\" fill=\"#304b60\"><text x=\"470\" y=\"246\">Vereinfachtes Teilchenmodell · nicht maßstabsgetreu · bei 25 °C</text></g></g></svg>";function render(){const s=DATA[hour].slides[index];$('hour').value=hour;$('eye').textContent='Stunde '+(hour+1)+' · '+DATA[hour].title;$('title').textContent=s[0];$('body').textContent=s[1];$('tip').textContent=s[2];$('iongraphic').hidden=!(hour===2&&index===2);$('iongraphic').innerHTML=(hour===2&&index===2)?'<img src="bilder/was-bestimmt-den-ph-wert.jpg" alt="Vergleich saurer, neutraler und alkalischer Lösungen mit Oxonium- und Hydroxidionen" style="width:100%;height:auto;border-radius:14px" onerror="this.outerHTML=ION_GRAPHIC">':'';$('counter').textContent='Folie '+(index+1)+' von '+DATA[hour].slides.length;$('prev').disabled=index===0;$('next').disabled=index===DATA[hour].slides.length-1;history.replaceState(null,'','?stunde='+(hour+1)+'&folie='+(index+1))}function move(n){index=Math.max(0,Math.min(DATA[hour].slides.length-1,index+n));render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('hour').onchange=e=>{hour=Number(e.target.value);index=0;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});index=Math.max(0,Math.min(DATA[hour].slides.length-1,(Number(q.get('folie'))||1)-1));render();
</script></body></html>
