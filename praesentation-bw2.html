const DATA=[{"title":"Eigenschaften von Trinkwasser","slides":[["Kundenauftrag: Was ist mit unserem Wasser los?","Familie Berger berichtet: Das Trinkwasser hinterlässt weiße Ränder am Wasserhahn. Der Wasserkocher setzt Kalk an. Ist das Wasser gesundheitsschädlich?","Euer Auftrag: Bereitet eine verständliche Erstberatung vor. Unterscheidet beobachtete Erscheinungen von Messwerten und schlagt geeignete Prüfungen vor."],["Was muss Trinkwasser leisten?","Trinkwasser muss gesundheitlich unbedenklich, genusstauglich und rein sein. Anforderungen regelt die Trinkwasserverordnung. Nicht jede optische Veränderung bedeutet automatisch eine Gesundheitsgefahr.","Unterscheidet: hygienische Qualität, chemische Zusammensetzung und technische Auswirkungen in der Installation."],["Wasser als Lösungsmittel","Wasser ist ein polares Molekül (H₂O). Darum können viele Salze als gelöste Ionen vorliegen. Wasser transportiert auch gelöste Gase, z. B. Sauerstoff und Kohlenstoffdioxid.","Merke: Gelöste Ionen sieht man nicht ohne Weiteres. Klares Wasser ist nicht automatisch frei von Inhaltsstoffen."],["Diese Ionen solltet ihr kennen","Calcium: Ca²⁺; Magnesium: Mg²⁺; Natrium: Na⁺; Chlorid: Cl⁻; Hydrogencarbonat: HCO₃⁻; Sulfat: SO₄²⁻.","Ca²⁺ und Mg²⁺ bestimmen maßgeblich die Wasserhärte. HCO₃⁻ spielt beim Kalk-Kohlensäure-Gleichgewicht eine wichtige Rolle."],["Drei Maße für Inhaltsstoffe","mg/l beschreibt die Masse pro Liter. mmol/l beschreibt die Stoffmenge pro Liter. 1 mmol = 0,001 mol.","Beispiel: 40,08 mg/l Calcium entsprechen 1,00 mmol/l Ca²⁺. 24,31 mg/l Magnesium entsprechen 1,00 mmol/l Mg²⁺."],["Kalk und Temperatur","Beim Erwärmen kann sich Kalk (Calciumcarbonat, CaCO₃) abscheiden, je nach Zusammensetzung und Gleichgewicht des Wassers. An Heizflächen kann dies Beläge verursachen.","Kalkbelag ist kein direkter Beweis für eine hygienische Verunreinigung. Beurteilt Betrieb und Wasseranalyse getrennt."],["Warum Korrosion ein anderes Thema ist","Korrosion hängt unter anderem von Werkstoff, Temperatur, Sauerstoff, pH-Wert, Salzgehalt und Betriebsbedingungen ab.","Hohe Härte allein erklärt Korrosion nicht. Ein auffälliger Geschmack, Geruch oder eine Färbung sollte fachgerecht untersucht werden."],["Messwerte der Familie Berger","Labor-/Versorgerdaten für den Übungsfall: Calcium 80 mg/l; Magnesium 24 mg/l; pH-Wert 7,4; Leitfähigkeit 710 µS/cm. Beobachtung: Kalkbeläge an Armaturen.","Auftrag: Ordnet jeden Wert einer physikalischen oder chemischen Eigenschaft zu. Welche Angaben fehlen für eine vollständige Trinkwasserbeurteilung?"],["Kundenantwort – Teil 1","Formuliert in vier Sätzen: Was erklärt den Kalk? Was kann man aus dem pH-Wert allein nicht folgern? Welche Dokumente oder Messungen fordert ihr an? Welche Sofortmaßnahme ist sinnvoll?","Ergebnis sichern: Eine begründete Erstdiagnose, aber noch keine pauschale Empfehlung zum Einbau einer Anlage."]]},{"title":"Wasserhärte","slides":[["Kundenauftrag: Woher kommen die Kalkablagerungen?","Familie Berger entdeckt weiße Beläge an Armaturen und im Wasserkocher. Laut Wasserversorger beträgt die Wasserhärte etwa 15 °dH. Die Familie fragt: Wo kommt der Kalk her? Ist hartes Wasser schlecht? Was können wir tun?","Euer Ziel: Erklärt den Weg des Wassers, die Entstehung der Härte und die Kalkbildung. Nutzt erst danach eine einfache Härte-Umrechnung für die Kundenberatung."],["Der natürliche Wasserkreislauf","Sonnenwärme lässt Wasser aus Meeren, Seen und Böden verdunsten. Wasserdampf kondensiert zu Wolken; Niederschlag fällt auf die Erde. Wasser fließt oberirdisch ab oder versickert und gelangt als Grundwasser über Quellen, Flüsse und Meere zurück.","Wichtig: Beim Verdunsten bleiben die meisten gelösten Salze zurück. Erst auf dem Weg durch Boden und Gestein nimmt das Wasser Mineralstoffe auf."],["Warum wird Regenwasser auf seinem Weg härter?","Regen- und Bodenwasser nimmt Kohlenstoffdioxid (CO₂) auf. Daraus bildet sich teilweise Kohlensäure. Beim Versickern durch kalkhaltiges Gestein können Calcium- und Magnesiumverbindungen gelöst werden.","Grundwasser ist deshalb je nach geologischem Untergrund unterschiedlich hart. Wasser aus kalkarmen Gesteinen ist häufig weicher als Wasser aus Kalk- oder Dolomitgebieten."],["Calcium und Magnesium: die Härtebildner","Gelöstes Calcium liegt als Ca²⁺, Magnesium als Mg²⁺ im Wasser vor. Diese positiv geladenen Ionen heißen Erdalkalimetallionen. Sie verursachen den größten Teil der natürlichen Wasserhärte.","Hydrogencarbonat (HCO₃⁻) ist häufig das passende negativ geladene Ion. Calcium und Magnesium sind natürliche Wasserbestandteile, keine Verschmutzung."],["Was bedeutet Gesamthärte?","Die Gesamthärte erfasst im Wesentlichen die Summe der gelösten Calcium- und Magnesiumionen. Bei der in Trinkwasser üblichen Näherung gilt: Gesamthärte in mmol/l ≈ c(Ca²⁺) + c(Mg²⁺).","Je mehr Ca²⁺ und Mg²⁺ vorhanden sind, desto höher ist die Gesamthärte. Nicht verwechseln: Gesamthärte beschreibt gelöste Ionen – Kalkbeläge sind feste Ablagerungen."],["Härtebereiche verständlich einordnen","Weich: weniger als 1,5 mmol/l bzw. 8,4 °dH. Mittel: 1,5 bis 2,5 mmol/l bzw. 8,4 bis 14 °dH. Hart: mehr als 2,5 mmol/l bzw. 14 °dH.","Familie Berger: 15 °dH = Härtebereich hart. Hartes Wasser ist nicht automatisch gesundheitsschädlich, kann aber bei Erwärmung stärkere Kalkablagerungen begünstigen."],["Was ist das Kalk-Kohlensäure-Gleichgewicht?","Im Wasser stehen gelöstes CO₂/Kohlensäure, Hydrogencarbonat (HCO₃⁻), Carbonat und Calciumcarbonat (CaCO₃) in einem chemischen Gleichgewicht. Je nach Bedingungen kann Kalk gelöst bleiben oder als Feststoff ausfallen.","Merksatz: Das Gleichgewicht beeinflusst, ob Wasser Kalk löst, mit Kalk im Gleichgewicht steht oder Kalk abscheidet. Temperatur, CO₂-Gehalt und pH-Wert spielen dabei zusammen."],["Wie kann Kalk im Boden gelöst werden?","Vereinfacht: CaCO₃ + CO₂ + H₂O ⇌ Ca²⁺ + 2 HCO₃⁻. Links: fester Kalkstein, Kohlenstoffdioxid und Wasser. Rechts: gelöstes Calcium und Hydrogencarbonat.","Bei CO₂-haltigem Wasser verschiebt sich das Gleichgewicht häufig in Richtung Lösung: Auf dem Weg durch Kalkgestein nimmt das Wasser Calcium auf. Bei Magnesium wirken ähnliche geochemische Prozesse."],["Warum entstehen Kalkbeläge beim Erwärmen?","Wird Wasser erwärmt und CO₂ ausgetrieben, können sich die Gleichgewichte verändern. Calciumcarbonat (CaCO₃) kann ausfallen und sich an Heizflächen und Armaturen ablagern. Vereinfacht lässt sich die Reaktion auch in umgekehrter Richtung lesen.","Ein weißer Kalkbelag ist daher nicht gleichbedeutend mit einer Schadstoffbelastung. Temperatur und Zusammensetzung entscheiden mit – Härte allein genügt nicht zur Vorhersage."],["Kalkabscheidung und Korrosion unterscheiden","Kalkabscheidung bedeutet: Festes Calciumcarbonat bildet Beläge. Korrosion bedeutet: Ein Werkstoff wird chemisch oder elektrochemisch angegriffen. Beide Vorgänge sind verschieden, können sich in einer Installation aber beeinflussen.","Für die Praxis müssen Werkstoff, Temperatur, Wasserbeschaffenheit, Betriebsbedingungen und Hygiene gemeinsam betrachtet werden."],["Welche Maßeinheiten braucht ihr?","mg/l bedeutet: Milligramm eines bestimmten Stoffes pro Liter Wasser (Massekonzentration). mmol/l bedeutet: Millimol Teilchen pro Liter (Stoffmengenkonzentration). °dH ist eine traditionelle Einheit für Wasserhärte.","Faustregel: 1 °dH ≈ 0,178 mmol/l Gesamthärte; 1 mmol/l Gesamthärte ≈ 5,6 °dH. Werte in mg/l muss man immer einem Stoff zuordnen."],["Ein Rechenbeispiel genügt: 15 °dH","Berger: 15 °dH × 0,1783 ≈ 2,67 mmol/l Gesamthärte. Als Calciumcarbonat-Äquivalent sind das rund 268 mg/l CaCO₃. Diese Zahl bezeichnet nicht die echte Konzentration an festem Kalk im Wasser.","Aus 15 °dH allein lässt sich nicht erkennen, wie viele mg/l Calcium und wie viele mg/l Magnesium vorliegen. Dazu benötigt ihr eine Wasseranalyse."],["Woher kommen die Zahlen 40,08 und 24,31?","Im Periodensystem steht bei Calcium (Ca, Ordnungszahl 20) die molare Masse 40,08 g/mol. Das heißt: 1 mol Calcium hat eine Masse von 40,08 g. Für 1 mmol (ein Tausendstel mol) sind es 40,08 mg. Bei Magnesium (Mg, Ordnungszahl 12) gilt entsprechend: 24,31 g/mol bzw. 24,31 mg/mmol.","Darum teilen wir bei der Umrechnung von mg/l in mmol/l für Calcium durch 40,08 mg/mmol und für Magnesium durch 24,31 mg/mmol. Die Zahlen sind keine willkürlichen Formeln, sondern stammen aus dem Periodensystem."],["Wenn Calcium und Magnesium in mg/l vorliegen","Beispiel einer Wasseranalyse: Calcium 80 mg/l; Magnesium 24 mg/l. 1 mmol Ca²⁺ wiegt 40,08 mg; 1 mmol Mg²⁺ wiegt 24,31 mg. Daher: Ca²⁺ = 80 ÷ 40,08 ≈ 2,00 mmol/l; Mg²⁺ = 24 ÷ 24,31 ≈ 0,99 mmol/l. Zusammen ≈ 2,99 mmol/l ≈ 16,7 °dH.","Warum teilen? Ihr berechnet, wie viele Portionen à 40,08 mg bzw. 24,31 mg in der jeweiligen Masse stecken. Hier nur als Zusatzbeispiel – wichtiger ist das Verständnis der Gesamthärte."],["Kundenauftrag lösen: Erklärt und beratet","Erstellt für Familie Berger eine kurze fachliche Kundenantwort: 1. Beschreibt den Wasserkreislauf und die Aufnahme von Mineralstoffen. 2. Erklärt Calcium, Magnesium und Gesamthärte. 3. Erläutert das Kalk-Kohlensäure-Gleichgewicht und die Ablagerungen beim Erwärmen. 4. Ordnet 15 °dH ein. 5. Empfehlt sinnvolle weitere Prüfschritte.","Begründete Empfehlung: Analyse des Versorgers und Betriebsbedingungen prüfen; Kalkbeläge fachgerecht entfernen, Warmwasserbereitung und Wartung beurteilen. Eine Enthärtungsanlage nicht allein wegen 15 °dH pauschal empfehlen."]]},{"title":"Der pH-Wert","slides":[["Kundenauftrag: Ist pH 7,4 problematisch?","Familie Berger liest in ihrer Wasseranalyse pH 7,4. Eine Nachbarin sagt: „Das Wasser ist zu sauer und greift die Rohre an.“","Prüft diese Aussage. Erklärt der Familie den pH-Wert ohne komplizierte Mathematik."],["pH-Wert: sauer, neutral oder alkalisch?","Der pH-Wert zeigt, ob eine wässrige Lösung eher sauer, neutral oder alkalisch (basisch) ist. Als einfache Orientierung bei 25 °C: pH 7 ist neutral, Werte darunter sind sauer, Werte darüber alkalisch.","Beispiele: Zitronensaft etwa pH 2, reines Wasser etwa pH 7, Seifenlösung oft pH 9–10. Das sind typische Orientierungswerte, keine festen Messwerte."],["Der wichtige Trick: Jede pH-Stufe bedeutet Faktor 10!","Von pH 7 auf pH 6: Die Wasserstoffionen-Aktivität ist 10-mal so groß. Von pH 7 auf pH 5: 10 × 10 = 100-mal so groß. Von pH 7 auf pH 4: 10 × 10 × 10 = 1.000-mal so groß.","Bei einer pH-Stufe nach oben ist es jeweils ein Zehntel. Man zählt also Zehnerschritte – die Logarithmusformel müsst ihr dafür nicht berechnen."],["So könnt ihr euch die pH-Skala merken","pH 4 → pH 5 → pH 6 → pH 7 → pH 8 → pH 9. Nach rechts wird die Wasserstoffionen-Aktivität pro Schritt zehnmal kleiner; nach links pro Schritt zehnmal größer.","Denkaufgabe: pH 5 verglichen mit pH 7? Zwei Schritte nach links, also 10 × 10 = 100-mal höhere Wasserstoffionen-Aktivität. Umgangssprachlich sagt man oft „100-mal saurer“."],["Was hat das mit den Teilchen im Wasser zu tun?","Saure Lösungen besitzen eine höhere Aktivität an Oxoniumionen (H₃O⁺). H₃O⁺ ist ein Wassermolekül mit einem zusätzlichen Wasserstoffion. Je mehr davon wirksam vorhanden sind, desto niedriger ist der pH-Wert.","Für unsere Berufsschul-Aufgaben genügt die Regel: niedriger pH → stärker sauer; ein pH-Schritt → Faktor 10. Die Formel mit „log“ braucht ihr nicht."],["Praxisvergleich: Leitungswasser und Mineralwasser","Leitungswasser liegt häufig etwa bei pH 7,0 bis 8,5 (je nach Region und Aufbereitung). Kohlensäurehaltiges Mineralwasser hat oft einen niedrigeren pH-Wert – beispielsweise etwa 5,5 bis 6,7, abhängig von CO₂-Gehalt und Mineralstoffen. Stilles Mineralwasser kann näher am neutralen Bereich liegen.","Warum? Gelöstes CO₂ beeinflusst das Kohlensäure-Gleichgewicht und senkt häufig den pH-Wert. Ein niedrigerer pH-Wert bei Sprudel ist nicht automatisch ein Qualitätsmangel. Vergleicht konkrete Etiketten oder Messtests statt alle Mineralwässer gleichzusetzen."],["Trinkwasser und pH-Wert","Nach der Trinkwasserverordnung liegt der allgemeine zulässige pH-Bereich bei 6,5 bis 9,5; besondere Bedingungen können zusätzlich gelten.","Familie Berger hat pH 7,4: Der Wert liegt im allgemeinen Bereich. Ob die Installation korrosionssicher ist, lässt sich daraus allein nicht beurteilen."],["Was beeinflusst den pH-Wert?","Kohlenstoffdioxid, Kohlensäure und Hydrogencarbonat stehen im Wasser in einem Gleichgewicht. Auch Temperatur und Aufbereitungsverfahren können den pH-Wert beeinflussen.","Verbindung zur Wasserhärte: Das Kalk-Kohlensäure-Gleichgewicht beeinflusst sowohl die Kalklösung als auch die Kalkabscheidung."],["pH-Wert und Korrosion: Nicht verwechseln","Korrosion hängt unter anderem von Rohrwerkstoff, Sauerstoff, pH-Wert, gelösten Salzen, Temperatur und Betriebsbedingungen ab.","Ein pH von 7,4 bedeutet weder „zu sauer“ noch automatisch „keine Korrosion“. Fachleute bewerten mehrere Wasserparameter zusammen."],["Kurzer Praxis-Check","Probe A: pH 6,4. Probe B: pH 7,4. Probe C: pH 9,6. Welche Proben liegen außerhalb des allgemeinen Bereichs 6,5–9,5? Und wie groß ist der Unterschied der Wasserstoffionen-Aktivität zwischen pH 6 und pH 8?","Antwort: A und C sind außerhalb. Zwischen pH 6 und pH 8 liegen zwei Stufen: bei pH 6 ist die Aktivität etwa 100-mal größer. Eine Abweichung erfordert fachliche Prüfung."],["Kundenauftrag lösen: Familie Berger beraten","Erklärt in 4–5 Sätzen: Was bedeutet pH 7,4? Warum ist der Unterschied zwischen pH 6 und pH 7 ein Faktor 10? Was kann man über die Rohre aus dem pH-Wert allein nicht sagen?","Kundengerecht formulieren – ohne Logarithmus. Ergebnis: pH 7,4 ist kein Hinweis auf übermäßig saures Wasser. Für Korrosionsfragen sind weitere Angaben nötig."]]},{"title":"Trinkwasserbehandlung","slides":[["Kundenauftrag: Brauchen Bergers eine Enthärtungsanlage?","Familie Berger hat Kalkbeläge an Armaturen und im Wasserkocher. Die Wasseranalyse ergibt 16,7 °dH. Ein Verkäufer empfiehlt sofort eine Enthärtungsanlage.","LEITFRAGE|Ist eine Enthärtungsanlage wirklich die beste Lösung? Entscheidet am Ende wie Fachkräfte – nicht wie Verkäufer."],["Erst verstehen: Was stört die Familie?","BEOBACHTUNG|Weiße Ablagerungen an Armaturen und am Wasserkocher.\nMESSWERT|Gesamthärte: 16,7 °dH → Härtebereich hart.\nOFFENE FRAGE|Wie stark sind Warmwasserbereitung und Leitungen tatsächlich betroffen?","DENKAUFTRAG|Was wissen wir sicher – und was müssen wir vor einer Empfehlung noch prüfen?"],["Warum bildet sich überhaupt Kalk?","Im Wasser sind Calcium- und Hydrogencarbonat-Ionen gelöst. Beim Erwärmen kann sich das Gleichgewicht so verschieben, dass Calciumcarbonat (Kalk) ausfällt.","MERKE|Kalkbelag ist nicht gleich gesundheitsschädliches Trinkwasser. Entscheidend sind Wasserzusammensetzung und Betriebsbedingungen."],["CO₂ als Schlüssel: Was passiert beim Erwärmen?","1|Im Wasser ist CO₂ gelöst.\n2|Erwärmung kann das Entweichen von CO₂ begünstigen.\n3|Das Kalk-Kohlensäure-Gleichgewicht verschiebt sich.\n4|Unter geeigneten Bedingungen fällt CaCO₃ aus.","PRAXISFRAGE|Warum findet ihr Kalk besonders häufig am Wasserkocher oder an Warmwasserflächen?"],["Drei Wege – aber welcher hilft gegen Kalk?","PARTIKELFILTER|Hält feste Teilchen zurück – gelöste Härtebildner bleiben.\nPFLEGE / BETRIEB|Beläge entfernen, Anlage überprüfen, Betriebsbedingungen optimieren.\nENTHÄRTUNG|Verringert Calcium- und Magnesiumionen – erfordert Planung und Wartung.","ABSTIMMUNG|Welche Maßnahme verändert tatsächlich die Wasserhärte?"],["Mini-Exkurs: Was bedeutet mmol/l?","mg/l|Wie viel Masse eines Stoffes steckt in einem Liter Wasser?\nmmol/l|Wie viele Teilchenportionen (Millimol) stecken in einem Liter Wasser?\n1 mmol|Ein Tausendstel mol. Die Teilchenmenge ist fest definiert.","ANSCHAULICH|mg/l zählt die Masse – mmol/l zählt die Stoffmenge. Für Calcium und Magnesium brauchen wir beide Angaben."],["Vom Laborwert zur Stoffmenge","CALCIUM|40,08 mg Calcium entsprechen 1 mmol Ca²⁺.\nMAGNESIUM|24,31 mg Magnesium entsprechen 1 mmol Mg²⁺.\nBEISPIEL|80 mg/l Calcium ÷ 40,08 mg/mmol ≈ 2,00 mmol/l.","MERKE|Die Zahlen 40,08 und 24,31 stammen aus den molaren Massen im Periodensystem. Nicht einfach mg/l von Calcium und Magnesium addieren."],["Zurück zur Praxis: mmol/l und °dH","BERGER|Calcium: 80 ÷ 40,08 ≈ 2,00 mmol/l.\nMAGNESIUM|24 ÷ 24,31 ≈ 0,99 mmol/l.\nGESAMTHÄRTE|2,00 + 0,99 ≈ 2,99 mmol/l ≈ 16,7 °dH.","KURZÜBUNG|1 mmol/l Gesamthärte entspricht etwa 5,6 °dH. Warum muss man für die Gesamthärte erst die mmol/l-Werte addieren?"],["Ionenaustauscher: Das Grundprinzip","Vor der Anlage: Calcium (Ca²⁺) und Magnesium (Mg²⁺) im Wasser.\nIm Harz: Die Härtebildner werden gebunden; dafür gelangen Natriumionen (Na⁺) ins Wasser.\nNach der Anlage: Die Gesamthärte ist geringer.","MERKE|Der Ionenaustauscher entfernt nicht einfach alle gelösten Stoffe. Er tauscht bestimmte Ionen aus."],["Warum werden zwei Natriumionen ausgetauscht?","Ein Calciumion hat die Ladung 2+. Ein Natriumion hat die Ladung 1+.\nDeshalb werden für ein Ca²⁺ zwei Na⁺ ausgetauscht.\nVereinfacht: 2 R–Na + Ca²⁺ → R₂–Ca + 2 Na⁺.","KURZE FRAGE|Wie viele Natriumionen werden für ein Magnesiumion (Mg²⁺) ausgetauscht?"],["Regeneration: Was passiert mit dem Harz?","1|Mit der Zeit sind viele Austauschplätze durch Ca²⁺ und Mg²⁺ belegt.\n2|Eine Kochsalzlösung (NaCl-Sole) regeneriert das Harz.\n3|Die verdrängten Härtebildner verlassen die Anlage mit dem Regenerationsabwasser.","PRAXIS|Dazu kommen Salzbedarf, Abwasser, Wartung und hygienisch einwandfreier Betrieb."],["Rechenbeispiel: Wie verändert sich Natrium?","Pro 1 mmol/l entfernter Härtebildner nimmt Natrium theoretisch um etwa 46 mg/l zu.\nBeispiel: Werden 2 mmol/l Härtebildner entfernt, steigt Natrium um rund 92 mg/l.","WICHTIG|Das vorhandene Natrium im Rohwasser kommt hinzu. Deshalb nicht blind auf null enthärten."],["Warum ist möglichst weich nicht automatisch besser?","Eine passende Einstellung richtet sich nach Anlage, Werkstoffen, Wasseranalyse und Herstellerangaben.\nHäufig wird nur teilweise enthärtet oder mit Rohwasser verschnitten.","MERKE|Das Ziel heißt bedarfsgerechter Anlagenschutz – nicht möglichst niedrige Härte um jeden Preis."],["Hygiene geht vor: Was darf nicht passieren?","Warmwassertemperaturen nicht auf Kosten des Legionellenschutzes absenken.\nWasserbehandlungsanlagen fachgerecht installieren, betreiben und warten.\nRückfließen verhindern und geltende technische Regeln beachten.","ENTSCHEIDUNG|Eine technische Maßnahme muss auch langfristig hygienisch sicher sein."],["Berger-Fall: Welche Empfehlung begründet ihr?","A|Beläge pflegen und Betrieb beobachten; weitere Daten prüfen.\nB|Fachgerecht geplante Teilenthärtung, falls ein konkreter Bedarf besteht.\nC|Ohne weitere Prüfung eine Anlage einbauen.","GRUPPENAUFTRAG|Wählt A, B oder C. Nennt jeweils zwei Gründe und eine noch offene Frage."],["Abschluss: Beratung statt Schnellverkauf","1|Befund: 16,7 °dH, Kalkbeläge, pH 7,4.\n2|Erklären: Kalkbildung durch Wasserzusammensetzung und Erwärmung.\n3|Prüfen: Wasseranalyse, Warmwasserbereitung, Werkstoffe, Betrieb.\n4|Abwägen: Pflege, Monitoring oder bedarfsgerechte Enthärtung.","ABSCHLUSS|Formuliert in drei Sätzen eine fachlich begründete Empfehlung an Familie Berger."]]}];const VISUALS={"3":"<div class=\"process\"><div><strong>CO₂ im Wasser</strong><span>gelöstes Gas</span></div><b>→</b><div><strong>Erwärmung</strong><span>CO₂ kann entweichen</span></div><b>→</b><div><strong>Kalkbildung</strong><span>CaCO₃ kann ausfallen</span></div></div>","7":"<div class=\"formula\"><span class=\"chip c\">2,00</span><span class=\"plus\">+</span><span class=\"chip n\">0,99</span><span class=\"equals\">=</span><span class=\"chip result\">2,99 mmol/l</span></div>","8":"<div class=\"process\"><div><strong>Rohwasser</strong><span>Ca²⁺ + Mg²⁺</span></div><b>→</b><div class=\"resin\"><strong>Ionenaustauscher</strong><span>Harz bindet Härtebildner</span></div><b>→</b><div><strong>Behandeltes Wasser</strong><span>weniger Ca²⁺ / Mg²⁺</span></div></div>","9":"<div class=\"formula\"><span class=\"chip c\">Ca²⁺</span><span class=\"equals\">↔</span><span class=\"chip n\">Na⁺</span><span class=\"plus\">+</span><span class=\"chip n\">Na⁺</span></div>","11":"<div class=\"formula\"><span class=\"chip c\">2 mmol/l</span><span class=\"equals\">×</span><span class=\"chip n\">46 mg/l</span><span class=\"equals\">=</span><span class=\"chip result\">92 mg/l mehr Na⁺</span></div>"};const q=new URLSearchParams(location.search);let hour=Math.max(0,Math.min(3,(Number(q.get('stunde'))||1)-1));let index=0;const $=x=>document.getElementById(x);DATA.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+': '+d.title;$('hour').append(o)});function render(){const s=DATA[hour].slides[index];$('hour').value=hour;$('eye').textContent='Stunde '+(hour+1)+' · '+DATA[hour].title;$('title').textContent=s[0];$('body').replaceChildren();const lines=s[1].split('\n');$('body').className='slide-content'+(lines.length>1?' card-layout':'');for(const line of lines){const el=document.createElement('div');el.className=lines.length>1?'statement':'main-statement';const j=line.indexOf('|');if(j>0){const head=document.createElement('strong');head.textContent=line.slice(0,j);el.append(head);el.append(document.createTextNode(line.slice(j+1)));}else{el.textContent=line} $('body').append(el)}$('visual').innerHTML=hour===3?(VISUALS[index]||''):'';const t=s[2].split('|');$('tip').textContent='';const strong=document.createElement('strong');strong.textContent=t.length>1?t[0]+' · ':'';$('tip').append(strong,document.createTextNode(t.length>1?t.slice(1).join('|'):s[2]));$('progress').style.width=((index+1)/DATA[hour].slides.length*100)+'%';$('counter').textContent='Folie '+(index+1)+' von '+DATA[hour].slides.length;$('prev').disabled=index===0;$('next').disabled=index===DATA[hour].slides.length-1;history.replaceState(null,'','?stunde='+(hour+1)+'&folie='+(index+1))}function move(n){index=Math.max(0,Math.min(DATA[hour].slides.length-1,index+n));render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('hour').onchange=e=>{hour=Number(e.target.value);index=0;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});index=Math.max(0,Math.min(DATA[hour].slides.length-1,(Number(q.get('folie'))||1)-1));render();
</script></body></html>
